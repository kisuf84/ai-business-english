  const item = state.currentItem;
  const mode = state.mode;
  if(!item) return `<div class="wrap" style="padding:60px 24px;"><p>Nothing to practice yet.</p></div>`;
  return `
  <div class="practice-shell">
    <button class="back-link" data-act="goSetup">${ICONS.chevronLeft} Back to ${mode==='shadow'?'sentences':'scenarios'}</button>
    <div class="practice-meta">
      ${catTag(item.catId)}
      ${progressDotsHTML()}
    </div>
    ${mode === 'shadow' ? shadowPromptHTML(item) : flowPromptHTML(item)}
    ${recorderZoneHTML(mode)}
  </div>`;
}

/* ===========================================================================
   FEEDBACK PANEL
   =========================================================================== */
function overallLabel(score){
  if(score == null) return { text:'Not enough audio', color:'var(--text-3)' };
  if(score >= 85) return { text:'Excellent', color:'var(--success)' };
  if(score >= 70) return { text:'Good progress', color:'var(--blue)' };
  if(score >= 50) return { text:'Fair — keep going', color:'var(--orange)' };
  return { text:'Keep practicing', color:'var(--danger)' };
}

function fbActionsHTML(fb){
  return `
    <div class="fb-actions">
      <button class="btn btn-secondary btn-block" data-act="tryAgain">${ICONS.refresh} Try again</button>
      <button class="btn btn-primary" data-act="nextItem">Next ${fb.mode==='shadow'?'sentence':'scenario'} ${ICONS.arrowRight}</button>
      <button class="btn btn-ghost" data-act="goSetup">${ICONS.search} Change ${fb.mode==='shadow'?'sentence':'scenario'}</button>
    </div>`;
}
function shadowFeedbackPanelHTML(fb){
  const lab = overallLabel(fb.overall);
  const rings = renderRing('accuracy','Pronunciation', fb.metrics.accuracy) + renderRing('tone','Tone', fb.metrics.tone) + renderRing('fluency','Fluency', fb.metrics.fluency);
  const transcriptBlock = `<div class="transcript-box"><h5>What Aria heard</h5>${fb.transcript ? escapeHtml(fb.transcript) : '<span style="color:var(--text-3)">No speech detected — try recording again a little closer to the mic.</span>'}</div>`;

  return `
  <div class="feedback-panel">
    <div class="fb-head">
      <div class="fb-overall">
        <span class="score mono" style="color:${lab.color}">${fb.overall == null ? '—' : fb.overall}</span>
        <span class="label"><b style="color:${lab.color}">${lab.text}</b><span>Overall score</span></span>
      </div>
    </div>
    <div class="ring-grid">${rings}</div>
    ${renderTips(fb.tips)}
    ${transcriptBlock}
    ${fbActionsHTML(fb)}
  </div>`;
}

function flowFeedbackPanelHTML(fb){
  const band = metricBand(fb.overall);
  const quote = fb.transcript
    ? `<p>"${highlightKeywords(fb.transcript, fb.keyPhrases)}"</p>`
    : `<p class="muted">No speech detected — try recording again a little closer to the mic.</p>`;
  const meters = renderMeter('fluency','Fluency', fb.metrics.fluency)
    + renderMeter('vocabulary','Vocabulary', fb.metrics.vocabulary)
    + renderMeter('grammar','Grammar', fb.metrics.grammar)
    + renderMeter('tone','Tone', fb.metrics.tone);
  const tips = (fb.tips || []).map(t => `<div class="ob-tip">→ ${escapeHtml(t.text)}</div>`).join('');

  return `
  <div class="feedback-panel flow-fb">
    <div class="fb-eyebrow">${ICONS.mic}<span>Your speaking feedback</span></div>
    <div class="quote-card">${ICONS.fileText}${quote}</div>
    <div class="meter-grid">${meters}</div>
    <div class="overall-banner" style="border-color:${band.color};background:color-mix(in srgb, ${band.color} 8%, var(--surface));">
      <div class="ob-title" style="color:${band.color}">OVERALL: ${fb.overall == null ? '—' : fb.overall}/100 — ${band.text.toUpperCase()}</div>
      <div class="ob-stats">${escapeHtml(transcriptStats(fb.transcript))}</div>
      ${tips}
    </div>
    ${fbActionsHTML(fb)}
  </div>`;
}

function feedbackPanelHTML(fb){
  return fb.mode === 'shadow' ? shadowFeedbackPanelHTML(fb) : flowFeedbackPanelHTML(fb);
}

function applyShadowWordDiff(diff){
  const box = document.getElementById('targetWords');
  if(!box) return;
  const spans = box.querySelectorAll('.word');
  spans.forEach((el, idx) => {
    el.classList.remove('w-hit','w-miss');
    const d = diff[idx];
    if(d && d.hit === true) el.classList.add('w-hit');
    else if(d && d.hit === false) el.classList.add('w-miss');
  });
}

function showFeedback(fb){
  const slot = document.getElementById('feedbackSlot');
  if(!slot) return;
  slot.innerHTML = feedbackPanelHTML(fb);
  if(fb.mode === 'shadow') applyShadowWordDiff(fb.diff);
  registerCompletion(fb.overall, fb.mode, state.currentItem.catId);
  if(typeof slot.scrollIntoView === 'function') slot.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/* ===========================================================================
   PRACTICE RUNTIME — imperative bindings for the currently mounted view
   =========================================================================== */
let rtRecording = false;       // true while the mic is actively listening
let rtSessionActive = false;   // true from tap-to-start until feedback (or an error) is shown -- covers the brief "Analyzing…" gap too
let recordingAborted = false;  // one-shot: set by abortRecordingIfActive so a pending onend/finish bails out silently
let rtTimerId = null;
let rtStartedAt = 0;
let rtPlaying = false;

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function playSentence(){
  if(!TTS.supported){ toast("This browser doesn't support text-to-speech playback."); return; }
  const btn = document.getElementById('playBtn');
  if(rtPlaying){ TTS.stop(); rtPlaying = false; if(btn) btn.classList.remove('playing'); return; }
  rtPlaying = true;
  if(btn) btn.classList.add('playing');
  TTS.speak(state.currentItem.text, state.speedRate, null, () => {
    rtPlaying = false;
    if(btn) btn.classList.remove('playing');
  });
}
function hearScenario(){
  if(!TTS.supported){ toast("This browser doesn't support text-to-speech playback."); return; }
  const item = state.currentItem;
  TTS.speak(`${item.context} Your turn: ${item.prompt}`, 1, null, null);
}
function setSpeed(rate){
  state.speedRate = rate;
  document.querySelectorAll('.speed-pill button').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.speed) === rate);
  });
}
function toggleSampleUI(){
  state.sampleShown = !state.sampleShown;
  const box = document.querySelector('.sample-box');
  const btn = document.querySelector('[data-act="toggleSample"]');
  if(box) box.classList.toggle('show', state.sampleShown);
  if(btn) btn.innerHTML = `${ICONS.bookOpen} ${state.sampleShown ? 'Hide sample answer' : 'See sample answer'}`;
}

function updateLiveCaption(){
  const caption = document.getElementById('liveCaption');
  if(!caption) return;
  const text = (rtTranscript + ' ' + rtInterim).trim();
  if(text){ caption.textContent = '"' + text + '"'; caption.classList.remove('placeholder'); }
  else { caption.textContent = 'Listening…'; caption.classList.add('placeholder'); }
}

/* mode: 'idle' | 'listening' | 'analyzing' */
function setLiveBoxState(mode){
  const liveBox = document.getElementById('liveBox');
  const label = document.getElementById('liveBoxLabel');
  const caption = document.getElementById('liveCaption');
  if(liveBox) liveBox.classList.toggle('is-live', mode === 'listening');
  if(label) label.textContent = mode === 'listening' ? 'Listening…' : (mode === 'analyzing' ? 'Analyzing…' : 'Transcript');
  if(mode === 'idle' && caption && !caption.textContent.includes('No speech')){
    caption.textContent = 'Tap the mic and start speaking — Aria is listening.';
    caption.classList.add('placeholder');
  }
}

function toggleRecord(){
  const btn = document.getElementById('recordBtn');
  const hint = document.getElementById('recHint');
  const timerEl = document.getElementById('recTimer');
  if(!btn) return;

  if(!recognition){
    toast("Speech recognition isn't supported in this browser.");
    return;
  }

  if(rtRecording){
    // ── Manual stop: user tapped the mic again while it was listening ──
    // Always call recognition.stop() here rather than gating on
    // recognitionActive -- start() was already called successfully (that's
    // why rtRecording is true), so the engine IS running even if its own
    // onstart event hasn't fired back to us yet. Skipping stop() in that
    // narrow window would finalize with an empty transcript despite speech
    // already being in flight.
    rtRecording = false;
    clearInterval(rtTimerId);
    btn.disabled = true;
    btn.classList.remove('recording');
    if(hint) hint.textContent = 'Analyzing your speech…';
    setLiveBoxState('analyzing');
    try{ recognition.stop(); }catch(e){ finishRecording(); }
    return;
  }

  // ── Start a fresh recording ──
  if(rtPlaying){ TTS.stop(); rtPlaying = false; }
  recSession++;
  rtTranscript = '';
  rtInterim = '';
  rtLastFinalizedResultIndex = -1;
  rtRestartCount = 0;
  rtRestartWindowStart = Date.now();
  clearTimeout(silenceTimer);
  errorHandled = false;
  recordingAborted = false;

  rtRecording = true;
  rtSessionActive = true;
  rtStartedAt = performance.now();
  btn.classList.add('recording');
  btn.innerHTML = ICONS.stop;
  if(hint) hint.textContent = 'Recording… tap to stop';
  if(timerEl){
    timerEl.style.visibility = 'visible';
    clearInterval(rtTimerId);
    const t0 = performance.now();
    rtTimerId = setInterval(() => { timerEl.textContent = fmtTime(performance.now()-t0); }, 250);
  }
  const existing = document.getElementById('feedbackSlot');
  if(existing) existing.innerHTML = '';
  if(state.mode === 'shadow') applyShadowWordDiff([]);
  setLiveBoxState('listening');
  updateLiveCaption();

  const mySession = recSession;
  const attemptStart = (isRetry) => {
    try{
      recognition.start();
      clearTimeout(startWatchdog);
      startWatchdog = setTimeout(() => {
        if(!recognitionActive && mySession === recSession && rtRecording){
          rtRecording = false;
          finishRecordingWithError("The microphone never responded. This usually means microphone access is blocked for this page, or the page is open inside a preview panel rather than a full browser tab -- try opening the file directly in a Chrome, Edge, or Safari tab.");
        }
      }, 4000);
    }catch(e){
      if(isRetry){
        rtRecording = false;
        rtSessionActive = false;
        btn.classList.remove('recording');
        btn.innerHTML = ICONS.mic;
        if(hint) hint.textContent = state.mode === 'shadow' ? 'Play the sentence, then tap to shadow it' : 'Tap to record your answer';
        setLiveBoxState('idle');
        toast("Couldn't start the microphone. Please tap the mic again.");
        return;
      }
      // Most likely an InvalidStateError: a previous session hadn't fully
      // torn down yet. Force it closed and retry once, shortly after.
      try{ recognition.abort(); }catch(e2){}
      recognitionActive = false;
      setTimeout(() => attemptStart(true), 250);
    }
  };
  attemptStart(false);
}

function finishRecording(){
  if(recordingAborted){ recordingAborted = false; rtSessionActive = false; return; }
  clearTimeout(silenceTimer);
  clearInterval(rtTimerId);
  const btn = document.getElementById('recordBtn');
  const hint = document.getElementById('recHint');
  const timerEl = document.getElementById('recTimer');
  if(btn){ btn.disabled = false; btn.classList.remove('recording'); btn.innerHTML = ICONS.mic; }
  if(timerEl) timerEl.style.visibility = 'hidden';

  // Combine the committed (finalized) transcript with any trailing "interim"
  // words still being recognized the moment the session ended -- otherwise
  // the last couple of spoken words can be lost.
  const transcript = (rtTranscript + ' ' + rtInterim).trim();
  const durationMs = performance.now() - rtStartedAt;
  setLiveBoxState('idle');
  const caption = document.getElementById('liveCaption');
  if(caption){
    if(transcript){ caption.textContent = '"' + transcript + '"'; caption.classList.remove('placeholder'); }
    else { caption.textContent = 'No speech detected — try recording again a little closer to the mic.'; caption.classList.add('placeholder'); }
  }
  if(hint) hint.textContent = state.mode === 'shadow' ? 'Tap to shadow it again' : 'Tap to record another take';

  const data = { transcript, durationMs, avgConfidence: null };
  const fb = state.mode === 'shadow'
    ? computeShadowFeedback(state.currentItem.text, data)
    : computeFlowFeedback(state.currentItem, data);
  state.lastFeedback = fb;
  rtSessionActive = false;
  showFeedback(fb);
}

function finishRecordingWithError(message){
  if(recordingAborted){ recordingAborted = false; rtSessionActive = false; return; }
  rtRecording = false;
  clearTimeout(silenceTimer);
  clearInterval(rtTimerId);
  const btn = document.getElementById('recordBtn');
  const hint = document.getElementById('recHint');
  const timerEl = document.getElementById('recTimer');
  if(btn){ btn.disabled = false; btn.classList.remove('recording'); btn.innerHTML = ICONS.mic; }
  if(timerEl) timerEl.style.visibility = 'hidden';
  setLiveBoxState('idle');
  const slot = document.getElementById('feedbackSlot');
  if(slot){ slot.innerHTML = `<div class="banner error">${ICONS.alert}<div>${escapeHtml(message)}</div></div>`; }
  if(hint) hint.textContent = state.mode === 'shadow' ? 'Play the sentence, then tap to shadow it' : 'Tap to record your answer';
  rtSessionActive = false;
}

function abortRecordingIfActive(){
  if(rtSessionActive){
    rtRecording = false;
    rtSessionActive = false;
    recordingAborted = true;
    clearInterval(rtTimerId);
    clearTimeout(silenceTimer);
    clearTimeout(startWatchdog);
    if(recognition){ try{ recognition.abort(); }catch(e){} }
  }
  if(rtPlaying){ TTS.stop(); rtPlaying = false; }
}

function tryAgain(){
  const slot = document.getElementById('feedbackSlot');
  if(slot) slot.innerHTML = '';
  if(state.mode === 'shadow') applyShadowWordDiff([]);
  setLiveBoxState('idle');
}

/* ===========================================================================
   NAVIGATION / CONTROLLER
   =========================================================================== */
const viewRoot = () => document.getElementById('viewRoot');

function render(){
  let html = '';
  if(state.view === 'home') html = homeHTML();
  else if(state.view === 'setup') html = setupHTML();
  else if(state.view === 'practice') html = practiceHTML();
  viewRoot().innerHTML = `<div class="view active">${html}</div>`;
  window.scrollTo(0,0);
  if(state.view === 'setup'){
    const input = document.getElementById('searchInput');
    if(input){
      input.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        state.visibleCount = 12;
        refreshList();
      });
    }
  }
}

function goHome(){ abortRecordingIfActive(); state.view = 'home'; render(); }
function goSetup(mode){
  abortRecordingIfActive();
  if(mode){ state.mode = mode; }
  state.searchQuery = '';
  state.visibleCount = 12;
  state.view = 'setup';
  render();
}
function toggleCat(catId){
  if(state.selectedCats.has(catId)){
    if(state.selectedCats.size > 1) state.selectedCats.delete(catId);
  } else {
    state.selectedCats.add(catId);
  }
  state.visibleCount = 12;
  render();
}
function openItem(item){
  abortRecordingIfActive();
  state.currentItem = item;
  state.currentCat = item.catId;
  state.sampleShown = false;
  state.lastFeedback = null;
  state.view = 'practice';
  render();
}
function pickItemById(id){
  const item = findItemById(id);
  if(item) openItem(item);
}
function startRandom(){
  const pool = filteredPool();
  if(!pool.length){ toast('No items match your search — try clearing it.'); return; }
  openItem(pickRandom(pool));
}
function shuffleFromList(){ startRandom(); }
function loadMore(){ state.visibleCount += 14; refreshList(); }
function nextItem(){
  const kind = currentPoolKind();
  let pool = [];
  state.selectedCats.forEach(c => pool = pool.concat(POOLS[c][kind]));
  if(!pool.length) pool = POOLS[state.currentItem.catId][kind];
  let candidate = pickRandom(pool);
  let guard = 0;
  while(candidate.id === state.currentItem.id && pool.length > 1 && guard < 10){ candidate = pickRandom(pool); guard++; }
  openItem(candidate);
}

/* ===========================================================================
   EVENT DELEGATION
   =========================================================================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  switch(act){
    case 'goHome': goHome(); break;
    case 'goSetup': goSetup(el.dataset.mode || null); break;
    case 'toggleCat': toggleCat(el.dataset.cat); break;
    case 'pickItem': pickItemById(el.dataset.id); break;
    case 'startRandom': startRandom(); break;
    case 'shuffleFromList': shuffleFromList(); break;
    case 'loadMore': loadMore(); break;
    case 'nextItem': nextItem(); break;
    case 'tryAgain': tryAgain(); break;
    case 'playSentence': playSentence(); break;
    case 'hearScenario': hearScenario(); break;
    case 'toggleSample': toggleSampleUI(); break;
    case 'toggleRecord': toggleRecord(); break;
    case 'setSpeed': setSpeed(parseFloat(el.dataset.speed)); break;
  }
});
document.getElementById('brandHome').addEventListener('click', goHome);
document.getElementById('themeToggle').addEventListener('click', () => applyTheme(state.theme === 'dark' ? 'light' : 'dark'));
document.addEventListener('visibilitychange', () => { if(document.hidden) abortRecordingIfActive(); });
window.addEventListener('pagehide', () => { if(rtRecording && recognition){ try{ recognition.abort(); }catch(e){} } });

/* ===========================================================================
   INIT
   =========================================================================== */
async function init(){
  await loadTheme();
  await loadProgress();
  render();
}
init();
</script>
</body>
</html>
