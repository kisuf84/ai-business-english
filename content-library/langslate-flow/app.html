/* ===========================================================================
   TEXT-TO-SPEECH — "Aria", the AI voice tutor. Browser-native, no API.
   =========================================================================== */
const TTS = {
  voice: null,
  loaded: false,
  _token: 0,          // bumped on every speak()/stop(): stale callbacks from an older utterance are ignored
  _timers: [],
  _u: null,           // strong reference to the live utterance (Chrome garbage-collects it mid-speech otherwise and 'end' never fires)
  _endPad: 3500,      // safety margin (ms) added to the estimated speaking time before we force-finish
  _lang(v){ return String((v && v.lang) || '').replace('_', '-'); },   // Android reports 'en_GB', desktop reports 'en-GB'
  _isEnglish(v){ return /^en(-|$)/i.test(this._lang(v)); },
  init(){
    if(!this.supported) return;
    const synth = window.speechSynthesis;
    const pick = () => {
      const voices = synth.getVoices ? synth.getVoices() : [];
      if(!voices || !voices.length) return false;
      const en = voices.filter(v => this._isEnglish(v));
      const gb = en.filter(v => /^en-GB$/i.test(this._lang(v)));
      // Never fall back to voices[0]: on a phone set to Spanish/French/Portuguese that is a
      // non-English voice, which reads English text with the wrong accent (or stays silent).
      this.voice =
        gb.find(v => /female|google uk|hazel|serena|libby|sonia|kate/i.test(v.name || '')) || gb[0] ||
        en.find(v => /^en-US$/i.test(this._lang(v))) || en[0] || null;
      this.loaded = true;
      return true;
    };
    if(!pick()){
      // Android Chrome fills the voice list asynchronously and sometimes never fires voiceschanged.
      let tries = 0;
      const iv = setInterval(() => { if(pick() || ++tries > 15) clearInterval(iv); }, 400);
    }
    try{ synth.addEventListener('voiceschanged', pick); }catch(e){ try{ synth.onvoiceschanged = pick; }catch(e2){} }
  },
  get supported(){ return typeof window !== 'undefined' && 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance !== 'undefined'; },
  _clearTimers(){ this._timers.forEach(clearTimeout); this._timers = []; },
  /* speak(text, rate, onStart, onEnd(ok)) — onEnd always fires exactly once (ok=false if audio could not play). */
  speak(text, rate, onStart, onEnd){
    if(!this.supported){ if(onEnd) onEnd(false); return; }
    const synth = window.speechSynthesis;
    const token = ++this._token;
    this._clearTimers();
    let finished = false;
    const finish = (ok) => {
      if(finished || token !== this._token) return;
      finished = true;
      this._clearTimers();
      this._u = null;
      if(onEnd) onEnd(ok);
    };
    const attempt = (n) => {
      if(token !== this._token) return;
      let started = false;
      const t0 = Date.now();
      const u = new SpeechSynthesisUtterance(text);
      if(n === 0 && this.voice){ u.voice = this.voice; u.lang = this._lang(this.voice) || 'en-GB'; }
      else { u.lang = 'en-US'; }          // 2nd attempt: let the device pick its own default English voice
      u.rate = rate || 1;
      u.pitch = 1;
      u.volume = 1;
      const fail = () => {
        if(token !== this._token || finished) return;
        this._clearTimers();
        try{ synth.cancel(); }catch(e){}
        if(n === 0) setTimeout(() => attempt(1), 150); else finish(false);
      };
      u.onstart = () => {
        if(token !== this._token || started) return;
        started = true;
        this._clearTimers();
        if(onStart) onStart();
        // Some Android engines never deliver 'end' — force-finish after the expected duration.
        const words = String(text).split(/\s+/).filter(Boolean).length;
        const est = (words / (2.2 * (rate || 1))) * 1000 + this._endPad;
        this._timers.push(setTimeout(() => { try{ synth.cancel(); }catch(e){} finish(true); }, est));
      };
      u.onend = () => {
        if(token !== this._token) return;
        if(!started && n === 0 && Date.now() - t0 < 120){ fail(); return; }   // ended instantly without ever starting = silent failure
        finish(true);
      };
      u.onerror = (ev) => {
        if(token !== this._token) return;
        const err = ev && ev.error;
        if(err === 'interrupted' || err === 'canceled'){ finish(true); return; }
        fail();
      };
      this._u = u;
      // If the engine never starts (stuck queue / unavailable voice), retry once, then give up visibly.
      this._timers.push(setTimeout(() => { if(!started) fail(); }, n === 0 ? 2800 : 3500));
      try{
        if(synth.paused && synth.resume) synth.resume();
        synth.speak(u);
      }catch(e){ fail(); }
    };
    let busy = false;
    try{ busy = !!(synth.speaking || synth.pending || synth.paused); if(busy) synth.cancel(); }catch(e){}
    // Android Chrome silently drops a speak() issued in the same tick as cancel(): wait for the queue to clear.
    if(busy) setTimeout(() => attempt(0), 220); else attempt(0);
  },
  stop(){
    this._token++;
    this._clearTimers();
    this._u = null;
    if(this.supported){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  }
};
TTS.init();

/* ===========================================================================
   PITCH DETECTION — autocorrelation-based fundamental-frequency estimate
   =========================================================================== */
/* ===========================================================================
   SPEECH RECOGNITION ENGINE — a single, persistent SpeechRecognition
   instance (created once, reused for every recording) plus a silence-based
   auto-stop, a start watchdog, and an auto-restart-on-empty-timeout loop.

   This replaces an earlier per-recording getUserMedia + AudioContext +
   MediaRecorder + SpeechRecognition stack. That stack asked the browser for
   the microphone TWICE — once via getUserMedia (for a pitch/volume
   analyser and audio playback) and once implicitly inside
   SpeechRecognition itself — and recreated a brand-new recognition object
   on every tap. In real browsers that combination is a common source of
   exactly the symptoms reported: recognition silently never starting,
   trailing words being dropped, and occasional permission contention
   between the two mic consumers. Speech-to-text now runs through
   SpeechRecognition alone — still 100% on-device/in-browser, no external
   API — which is both simpler and more reliable.
   =========================================================================== */
let recognition = null;
let recognitionActive = false;   // true once the engine has confirmed it's listening (onstart fired)
let errorHandled = false;        // true when onerror already finalized the UI -- stops onend from stomping on it
let startWatchdog = null;        // catches "recognition.start() was called but never actually started"
let silenceTimer = null;         // auto-finish once the user has gone quiet AFTER already saying something
let recSession = 0;              // bumped every time a new recording begins; guards stale async callbacks

// Finalized speech is stored as a list of distinct CONTENT chunks, merged by
// comparing text, not by trusting the engine's result index. Chrome on
// Android (and other mobile engines) has a long-standing continuous-mode bug
// where each "final" delivery repeats the ENTIRE growing hypothesis so far
// ("hey" -> "hey Alex" -> "hey Alex do" -> ...) -- and, contrary to what a
// first look suggests, each of those redeliveries can arrive under a
// DIFFERENT, incrementing result index, not the same one. That means an
// index-keyed store (this file's first attempt at this fix) still stacks
// every growing snapshot as its own separate chunk and reproduces the exact
// word-repetition cascade. The only reliable signal is the text itself: when
// a newly-finalized chunk is simply a longer (or shorter) version of the
// chunk most recently committed -- one is a prefix of the other, or the two
// otherwise overlap almost completely -- it's a redelivery of the same
// utterance and should REPLACE that chunk, never sit alongside it. Only text
// that doesn't overlap the last chunk is genuinely new speech and gets
// appended.
let rtFinalChunks = [];

function normalizeForCompare(s){
  return (s || '').toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
}

function ingestFinalChunk(rawText){
  const text = (rawText || '').trim();
  if(!text) return;
  if(rtFinalChunks.length === 0){ rtFinalChunks.push(text); return; }

  const lastIdx = rtFinalChunks.length - 1;
  const last = rtFinalChunks[lastIdx];
  const normNew = normalizeForCompare(text);
  const normLast = normalizeForCompare(last);
  if(!normNew || normNew === normLast) return; // empty or an exact resend -- nothing new

  if(normNew.startsWith(normLast) || normLast.startsWith(normNew)){
    // One is a growing/shrinking variant of the other (the mobile bug
    // above) -- keep whichever is more complete instead of stacking both.
    if(text.length >= last.length) rtFinalChunks[lastIdx] = text;
    return;
  }

  // Fuzzy fallback: some engines re-guess slightly different wording for
  // words already spoken (punctuation, minor corrections) while still
  // extending the phrase, so an exact prefix match can miss a real
  // redelivery. Treat it as the same underlying utterance only when the two
  // share a long, unbroken common prefix of WORDS (not just characters) --
  // a high bar, so two genuinely separate short sentences don't accidentally
  // get merged into one.
  const wordsNew = normNew.split(' ');
  const wordsLast = normLast.split(' ');
  const minLen = Math.min(wordsNew.length, wordsLast.length);
  let commonPrefixWords = 0;
  while(commonPrefixWords < minLen && wordsNew[commonPrefixWords] === wordsLast[commonPrefixWords]) commonPrefixWords++;
  const overlapRatio = minLen > 0 ? commonPrefixWords / minLen : 0;
  if(minLen >= 3 && overlapRatio >= 0.8 && wordsNew.length >= wordsLast.length){
    rtFinalChunks[lastIdx] = text;
    return;
  }

  // Genuinely new, unrelated content -- a separate finalized segment.
  rtFinalChunks.push(text);
}

function finalTranscriptText(){ return rtFinalChunks.join(' ').trim(); }

let rtInterim = '';
let rtRestartCount = 0;
let rtRestartWindowStart = 0;

const SILENCE_AUTO_STOP_MS = 2200;

const Recorder = {
  get sttSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
};

if(Recorder.sttSupported){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  // Deliberately NOT continuous. Chrome on Android buffers noticeably (often
  // a full second or more) before it will fire anything at all in
  // continuous mode, which is exactly the "transcript lags behind my voice"
  // delay users reported -- it's also what produced the growing-duplicate
  // "final" results fixed above. Non-continuous mode processes and returns
  // each utterance far more promptly. To still support recording longer,
  // multi-sentence answers, onend below immediately restarts the recognizer
  // for the next utterance whenever the user hasn't actually finished (see
  // the onend handler) -- so from the user's perspective the mic never
  // stops listening, it just returns each phrase quickly instead of
  // stalling on one long buffered stream.
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    recognitionActive = true;
    clearTimeout(startWatchdog);
  };

  // Accumulate each newly-finalized chunk onto the running transcript rather
  // than rebuilding it from ev.results (engines can reset that internally),
  // and keep the not-yet-finalized "interim" tail separate for the live
  // caption. Every time new speech arrives, restart the silence clock --
  // once it completes uninterrupted we treat the answer as finished and
  // wrap up automatically, exactly as if the user tapped stop.
  recognition.onresult = (ev) => {
    // Guard on rtSessionActive (not rtRecording): rtRecording flips to
    // false the instant the user taps stop, but the engine can still
    // deliver an in-flight final result for a moment afterward while
    // finishing up -- that trailing content must still be captured, not
    // discarded. rtSessionActive only goes false once the session has
    // actually finished (or been aborted).
    if(!rtSessionActive) return;
    let interim = '';
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const res = ev.results[i];
      if(res.isFinal){
        // Content-based merge, not index-based: see the comment above
        // rtFinalChunks/ingestFinalChunk for why the index can't be trusted.
        ingestFinalChunk(res[0].transcript);
      } else {
        interim += res[0].transcript;
      }
    }
    rtInterim = interim;
    updateLiveCaption();
    const hasContent = (finalTranscriptText() + interim.trim()).length > 0;
    if(hasContent){
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => autoFinishOnSilence(recSession), SILENCE_AUTO_STOP_MS);
    }
  };

  recognition.onerror = (ev) => {
    recognitionActive = false;
    clearTimeout(startWatchdog);
    if(recordingAborted) return; // intentional abort (e.g. navigated away) -- onend will consume the flag
    if(ev.error === 'no-speech'){
      // Not a real failure -- the engine just hasn't picked up audio yet.
      // onend fires right after this; the onend handler decides whether to
      // restart (nothing said yet) or finalize (they'd already started).
      return;
    }
    // A genuine failure: permission blocked, no device, no connection, etc.
    clearTimeout(silenceTimer);
    if(!rtRecording) return;
    rtRecording = false;
    errorHandled = true; // tell onend (fires right after) not to overwrite this
    finishRecordingWithError(friendlyASRError(ev.error));
  };

  recognition.onend = () => {
    recognitionActive = false;
    clearTimeout(startWatchdog);
    if(errorHandled){ errorHandled = false; return; }
    if(recordingAborted){ recordingAborted = false; return; }

    if(rtRecording){
      // Since recognition.continuous is false, the engine ends its session
      // after EVERY utterance -- whether or not it heard anything -- so
      // this firing does not by itself mean "the user is done." The
      // dedicated silence timer (autoFinishOnSilence, below) is what
      // decides that, independent of this per-utterance engine end: it
      // watches for SILENCE_AUTO_STOP_MS of quiet time after the user has
      // already said something. Here, as long as rtRecording is still true
      // (the user hasn't tapped stop and the silence timer hasn't fired),
      // simply restart listening for the next utterance -- from the user's
      // perspective this keeps the mic open continuously.
      const hasContent = (finalTranscriptText() + rtInterim.trim()).length > 0;
      if(!hasContent){
        // The restart-limit safety net applies ONLY while nothing has been
        // heard yet this session. Restarting after every utterance is the
        // normal, expected steady state once real speech has come through,
        // so it must never trip this "mic seems dead" diagnostic.
        const now = Date.now();
        if(now - rtRestartWindowStart > 20000){ rtRestartWindowStart = now; rtRestartCount = 0; }
        rtRestartCount++;
        if(rtRestartCount > 10){
          rtRecording = false;
          finishRecordingWithError(t('e_deadMic'));
          return;
        }
      }
      try{ recognition.start(); }
      catch(e){ rtRecording = false; finishRecording(); }
      return;
    }
    // Manual stop already in progress -- this is the real, intentional end.
    clearTimeout(silenceTimer);
    finishRecording();
  };
}

function friendlyASRError(code){
  switch(code){
    case 'not-allowed':
    case 'service-not-allowed': return t('e_notAllowed');
    case 'audio-capture': return t('e_audioCapture');
    case 'network': return t('e_network');
    case 'aborted': return t('e_aborted');
    default: return t('e_default', { code });
  }
}

// The one true "the user is done talking" signal, independent of whatever
// the engine's own per-utterance onend is doing: fires after
// SILENCE_AUTO_STOP_MS of quiet following speech that was actually heard.
function autoFinishOnSilence(session){
  if(session !== recSession || !rtRecording) return; // stale timer from a finished/switched recording
  rtRecording = false;
  const btn = document.getElementById('recordBtn');
  if(btn){ btn.disabled = true; }
  const hint = document.getElementById('recHint');
  if(hint) hint.textContent = t('p_analyzingSpeech');
  if(recognitionActive){
    try{ recognition.stop(); }catch(e){ finishRecording(); }
  } else {
    finishRecording();
  }
}


/* ===========================================================================
   FEEDBACK ENGINE — 100% on-device scoring. No network call, no external API.
   Combines: word-accuracy (Levenshtein/LCS), speech pacing, pitch variance
   (tone/expressiveness), volume dynamics, keyword coverage, lexical variety
   and light grammatical heuristics.
   =========================================================================== */
const FILLERS = ['um','uh','erm','er','hmm','like','you know','sort of','kind of'];
const CONNECTORS = ['because','so','but','when','if','that','which','although','since','while','however','and then','after that'];
const VERB_HINTS = ['is','are','was','were','am','be','been','have','has','had','will','would','can','could','should','do','does','did','go','goes','went','going','think','thinks','thought','know','knew','want','wanted','need','needed','like','liked','love','loved','work','works','working','worked','plan','plans','planning','get','gets','got','make','makes','made','say','says','said','see','sees','saw','feel','feels','felt','look','looks','looked','come','comes','came','take','takes','took','give','gives','gave','ask','asks','asked','tell','tells','told','call','calls','called','try','tries','tried','meet','meets','met','use','uses','used','find','finds','found'];
const POLITE_WORDS = ['please','thank','appreciate','would','could','kindly','happy','glad','certainly','absolutely','of course','looking forward','i hope','i trust'];
const FORMAL_WORDS = ['regarding','furthermore','however','therefore','consequently','in addition','moreover','as a result','i would like to','i am writing to','i recommend','i suggest'];
const NEG_WORDS = ["don't","can't","won't","hate","terrible","awful","stupid","bad","wrong","never mind","whatever"];

function normWords(text){
  return (text || '').toLowerCase().replace(/[^a-z0-9'\s]/g, ' ').split(/\s+/).filter(Boolean);
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function mean(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function stddev(arr){ if(arr.length < 2) return 0; const m = mean(arr); return Math.sqrt(mean(arr.map(v=>(v-m)*(v-m)))); }
function scoreBand(value, lowHard, lowIdeal, highIdeal, highHard){
  if(!isFinite(value)) return 45;
  if(value <= lowHard) return 15;
  if(value >= highHard) return 25;
  if(value >= lowIdeal && value <= highIdeal) return 100;
  if(value < lowIdeal) return Math.round(15 + 85*(value-lowHard)/(lowIdeal-lowHard));
  return Math.round(25 + 75*(highHard-value)/(highHard-highIdeal));
}

/* LCS-based word alignment for Shadow-mode accuracy + diff highlighting */
function wordAlignment(targetWords, spokenWords){
  const n = targetWords.length, m = spokenWords.length;
  const dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for(let i=1;i<=n;i++){
    for(let j=1;j<=m;j++){
      dp[i][j] = targetWords[i-1] === spokenWords[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const hits = new Array(n).fill(false);
  let i=n, j=m;
  while(i>0 && j>0){
    if(targetWords[i-1] === spokenWords[j-1]){ hits[i-1] = true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  return { hits, lcsLen: dp[n][m] };
}

/* Transcript-based tone heuristic -- word choice (politeness/formality vs
   negativity), not audio pitch. This removes the app's last dependency on
   AudioContext/pitch analysis, so Tone grades from the same reliable
   transcript source as every other metric. */
function toneScore(transcript){
  const words = normWords(transcript);
  if(words.length < 2) return { score: null };
  const lower = transcript.toLowerCase();
  let score = 55;
  const politeHits = POLITE_WORDS.filter(w => lower.includes(w)).length;
  const formalHits = FORMAL_WORDS.filter(w => lower.includes(w)).length;
  const negHits = NEG_WORDS.filter(w => lower.includes(w)).length;
  score += Math.min(24, politeHits*8);
  score += Math.min(24, formalHits*10);
  score -= Math.min(30, negHits*10);
  if(words.length > 5) score = Math.max(score, 40);
  return { score: Math.round(clamp(score, 10, 100)) };
}

function fluencyScore(transcript, durationMs, avgConfidence){
  const words = normWords(transcript);
  const seconds = Math.max(0.6, durationMs/1000);
  const wps = words.length / seconds;
  const paceScore = scoreBand(wps, 0.55, 1.5, 3.1, 4.6);
  const fillerCount = FILLERS.reduce((n,f)=> n + (transcript.toLowerCase().split(f).length - 1), 0);
  const fillerRatio = words.length ? fillerCount / words.length : 0;
  const fillerScore = clamp(100 - fillerRatio*260, 15, 100);
  let confScore = null;
  if(typeof avgConfidence === 'number' && avgConfidence > 0) confScore = clamp(avgConfidence*100, 30, 100);
  const parts = [ {v:paceScore, w:0.62}, {v:fillerScore, w:0.38} ];
  if(confScore !== null) { parts.push({v:confScore, w:0.25}); }
  const totalW = parts.reduce((s,p)=>s+p.w,0);
  const score = Math.round(parts.reduce((s,p)=> s + p.v*p.w, 0) / totalW);
  return { score, wps, fillerCount };
}

function grammarScore(transcript){
  const words = normWords(transcript);
  if(words.length < 2) return { score: null, reason:'too-short' };
  let score = 62;
  const hasVerb = words.some(w => VERB_HINTS.includes(w));
  if(hasVerb) score += 14; else score -= 18;
  if(words.length >= 6) score += 8;
  if(words.length >= 12) score += 6;
  if(words.length < 4) score -= 20;
  let repeats = 0;
  for(let i=1;i<words.length;i++){ if(words[i] === words[i-1]) repeats++; }
  score -= repeats*10;
  const lower = transcript.toLowerCase();
  const connectorHits = CONNECTORS.filter(c => lower.includes(c)).length;
  score += Math.min(12, connectorHits*6);
  if(words.length > 45 && connectorHits === 0) score -= 8;
  return { score: Math.round(clamp(score, 10, 100)), hasVerb, connectorHits };
}

function vocabularyScore(transcript, vocabHints){
  const words = normWords(transcript);
  if(words.length < 2) return { score: null, hits: [] };
  const lower = transcript.toLowerCase();
  const hints = vocabHints || [];
  const hitList = hints.filter(h => lower.includes(h.toLowerCase()));
  const coverage = hints.length ? hitList.length / hints.length : 0.5;
  const unique = new Set(words);
  const diversity = clamp(unique.size / words.length, 0, 1);
  const diversityScore = words.length < 6 ? clamp(diversity*70, 0, 70) : diversity*100;
  const avgLen = mean(words.map(w=>w.length));
  const lengthScore = scoreBand(avgLen, 2.6, 3.6, 6.2, 8.5);
  const score = Math.round(coverage*100*0.45 + diversityScore*0.30 + lengthScore*0.25);
  return { score: clamp(score, 10, 100), hits: hitList, coverage };
}

const TIP_BANK = {
  accuracy: {
    low: ["Try breaking the sentence into smaller chunks and shadow each piece before saying it in full.", "Slow the playback to 0.75× and listen closely to the words you're missing before recording again."],
    mid: ["You're close — focus on the words underlined in red and repeat just those a few times.", "Nice effort. Re-play the sentence once more and try to mirror the exact word order."],
    high: ["Excellent word-for-word accuracy — your ear for the sentence is really sharp.", "Spot on! You're matching the target sentence almost perfectly."]
  },
  tone: {
    low: ["Your delivery sounds a little flat — try exaggerating the rise and fall in your voice, like you're telling a story.", "Add more melody: stress the important word in the sentence a bit more."],
    mid: ["Good energy — pushing your pitch range a little further will make you sound even more natural.", "You're varying your tone nicely; keep leaning into the emotion of the sentence."],
    high: ["Your intonation sounds natural and expressive — that's exactly how a native speaker would say it.", "Great vocal variety! Your tone keeps the listener engaged."]
  },
  fluency: {
    low: ["You paused quite a bit — try saying the whole sentence in one breath, even if it feels fast.", "Watch your filler words (um, uh) — a short silent pause sounds more confident."],
    mid: ["Your pace is close to natural — a little more consistency will make it sound even smoother.", "Good rhythm overall; try to keep a steady pace from start to finish."],
    high: ["Your pacing sounds smooth and natural — right in the sweet spot of conversational speech.", "Great fluency — no awkward pauses, nice and confident."]
  },
  grammar: {
    low: ["Try to include a clear subject and verb, like 'I think...' or 'We are...', to complete the thought.", "Short fragments are fine to practice, but try answering in a full sentence next time."],
    mid: ["Solid structure — linking two ideas with 'because' or 'so' would make it even stronger.", "You're forming clear sentences; try adding one more detail to extend your answer."],
    high: ["Well-formed, natural sentence structure — that reads like fluent, confident English.", "Great grammar control, including how you linked your ideas together."]
  },
  vocabulary: {
    low: ["Try weaving in a few of the suggested phrases from the scenario to sound more precise.", "Reach for a slightly more specific word instead of a general one — it'll sound more natural."],
    mid: ["Nice range of words — using one more scenario-specific phrase would round this out.", "Good vocabulary choices; vary your word choice a little more to avoid repetition."],
    high: ["Rich, varied vocabulary — you used exactly the kind of language a fluent speaker would reach for.", "Excellent word choice, including natural, scenario-specific phrasing."]
  }
};
function pickTip(metric, score){
  const bank = TIP_BANK[metric];
  if(!bank || score === null) return null;
  const level = score < 62 ? 'low' : (score < 85 ? 'mid' : 'high');
  const list = bank[level];
  const idx = Math.floor(Math.random()*list.length);
  // `text` is the English copy (kept for compatibility); the UI resolves the
  // wording from { metric, level, idx } in the CURRENT language at render time.
  return { text: list[idx], level, idx };
}
function tipText(tip){
  const d = I18N[CUR_LANG] && I18N[CUR_LANG].tips;
  const arr = d && d[tip.metric] && d[tip.metric][tip.level];
  return (arr && arr[tip.idx]) || tip.text;
}

function weightedOverall(parts){
  const avail = parts.filter(p => p.score !== null && p.score !== undefined);
  if(!avail.length) return null;
  const totalW = avail.reduce((s,p)=>s+p.w,0);
  return Math.round(avail.reduce((s,p)=> s + p.score*p.w, 0) / totalW);
}
function buildTips(parts){
  const avail = parts.filter(p => p.score !== null && p.score !== undefined);
  if(!avail.length) return [];
  const sorted = avail.slice().sort((a,b)=> a.score - b.score);
  const weak = sorted.slice(0, 2);
  const tips = weak.map(p => ({ metric:p.key, ...pickTip(p.key, p.score) }));
  const best = sorted[sorted.length-1];
  if(best.score >= 85 && !weak.includes(best)){
    tips.push({ metric:best.key, ...pickTip(best.key, best.score) });
  }
  return tips.filter(t => t && t.text).slice(0,3);
}

function computeShadowFeedback(targetText, data){
  const targetWords = normWords(targetText);
  const spokenWords = normWords(data.transcript);
  let accuracy = null, diff = targetWords.map(w => ({ word:w, hit:null }));
  if(spokenWords.length){
    const { hits, lcsLen } = wordAlignment(targetWords, spokenWords);
    accuracy = Math.round((lcsLen / Math.max(1,targetWords.length)) * 100);
    diff = targetWords.map((w,idx) => ({ word:w, hit: hits[idx] }));
  }
  const tone = toneScore(data.transcript);
  const fluency = fluencyScore(data.transcript, data.durationMs, data.avgConfidence);
  const overall = weightedOverall([
    { key:'accuracy', score:accuracy, w:1.5 },
    { key:'tone', score:tone.score, w:1 },
    { key:'fluency', score:fluency.score, w:1 }
  ]);
  const tips = buildTips([
    { key:'accuracy', score:accuracy },
    { key:'tone', score:tone.score },
    { key:'fluency', score:fluency.score }
  ]);
  return {
    mode:'shadow', overall,
    metrics:{ accuracy, tone: tone.score, fluency: fluency.score },
    diff, transcript: data.transcript, tips,
    sttAvailable: Recorder.sttSupported
  };
}

function computeFlowFeedback(scenario, data){
  const tone = toneScore(data.transcript);
  const fluency = fluencyScore(data.transcript, data.durationMs, data.avgConfidence);
  const grammar = grammarScore(data.transcript);
  const vocabulary = vocabularyScore(data.transcript, scenario.vocab);
  const overall = weightedOverall([
    { key:'tone', score:tone.score, w:1 },
    { key:'fluency', score:fluency.score, w:1 },
    { key:'grammar', score:grammar.score, w:1 },
    { key:'vocabulary', score:vocabulary.score, w:1 }
  ]);
  const tips = buildTips([
    { key:'tone', score:tone.score },
    { key:'fluency', score:fluency.score },
    { key:'grammar', score:grammar.score },
    { key:'vocabulary', score:vocabulary.score }
  ]);
  const words = normWords(data.transcript);
  const lower = data.transcript.toLowerCase();
  const keyPhrases = (scenario.vocab||[]).filter(h => lower.includes(h.toLowerCase()));
  return {
    mode:'flow', overall,
    metrics:{ tone: tone.score, fluency: fluency.score, grammar: grammar.score, vocabulary: vocabulary.score },
    transcript: data.transcript, keyPhrases, tips,
    sttAvailable: Recorder.sttSupported, hasTranscript: words.length > 0
  };
}

/* ===========================================================================
   RENDER HELPERS
   =========================================================================== */
function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Single source of truth for score → band label/color, used by rings,
   linear meters and the overall score label so the whole app speaks the
   same scoring language. */
function metricBand(score){
  if(score == null) return { text:'—', color:'var(--text-3)' };
  if(score >= 85) return { text:t('band_excellent'), color:'var(--success)' };
  if(score >= 70) return { text:t('band_good'), color:'var(--blue)' };
  if(score >= 50) return { text:t('band_fair'), color:'var(--orange)' };
  return { text:t('band_keep'), color:'var(--danger)' };
}

function renderRing(id, label, score){
  const R = 32, C = 2*Math.PI*R;
  const pct = score == null ? 0 : clamp(score,0,100);
  const offset = C * (1 - pct/100);
  const color = metricBand(score).color;
  return `<div class="ring-card">
    <div class="ring">
      <svg viewBox="0 0 76 76">
        <circle class="track" cx="38" cy="38" r="${R}"></circle>
        <circle class="fill" cx="38" cy="38" r="${R}" stroke="${color}" stroke-dasharray="${C}" stroke-dashoffset="${offset}"></circle>
      </svg>
      <div class="num">${score == null ? '—' : Math.round(score)}</div>
    </div>
    <h5>${label}</h5>
  </div>`;
}

function renderMeter(metric, label, score){
  const band = metricBand(score);
  const pct = score == null ? 0 : clamp(score,0,100);
  return `<div class="meter-card" data-metric="${metric}">
    <div class="m-label">${label}</div>
    <div class="m-num" style="color:${band.color}">${score == null ? '—' : Math.round(score)}</div>
    <div class="bar-row">
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${band.color}"></div></div>
      <div class="m-band" style="color:${band.color}">${band.text}</div>
    </div>
  </div>`;
}

/* Builds the short "N words in M sentences. filler-word note" line used in
   the Free Flow overall banner. */
function transcriptStats(transcript){
  const words = normWords(transcript);
  if(!words.length) return t('st_none');
  const sentenceCount = Math.max(1, (transcript.match(/[.!?]+/g) || []).length);
  const fillers = ['um','uh','umm','uhh','erm','er','like','you know'];
  const fillerCount = words.filter(w => fillers.includes(w)).length;
  const wordsPart = t('st_main', { w:words.length, wl: t(words.length===1?'st_word1':'st_wordN'), s:sentenceCount, sl: t(sentenceCount===1?'st_sent1':'st_sentN') });
  const fillerPart = fillerCount === 0 ? t('st_noFiller') : (fillerCount === 1 ? t('st_filler1') : t('st_fillerN', { n:fillerCount }));
  return `${wordsPart} ${fillerPart}`;
}
function tipIcon(level){ return level==='high' ? ICONS.checkCircle : (level==='low' ? ICONS.alert : ICONS.info); }
function tipClass(level){ return level==='high' ? 'good' : (level==='low' ? 'warn' : 'info'); }
function renderTips(tips){
  if(!tips || !tips.length) return '';
  return `<div class="tip-list">${tips.map(tp => `<div class="tip ${tipClass(tp.level)}">${tipIcon(tp.level)}<div>${escapeHtml(tipText(tp))}</div></div>`).join('')}</div>`;
}
function wordDiffHTML(diff){
  return diff.map(d => {
    if(d.hit === null) return `<span class="word">${escapeHtml(d.word)}</span>`;
    return `<span class="word ${d.hit ? 'w-hit' : 'w-miss'}">${escapeHtml(d.word)}</span>`;
  }).join(' ');
}
function highlightKeywords(transcript, hits){
  if(!transcript) return '<span style="color:var(--text-3)">No speech detected.</span>';
  let html = escapeHtml(transcript);
  hits.forEach(h => {
    const esc = escapeHtml(h);
    const re = new RegExp('('+esc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    html = html.replace(re, '<span class="w-key">$1</span>');
  });
  return html;
}
function catIcon(catId){ return ICONS[CATS[catId].icon]; }
function catTag(catId){
  const c = CATS[catId];
  return `<span class="cat-tag" style="--cat-color:${c.color}">${catIcon(catId)} ${catLabel(catId)}</span>`;
}

function currentPoolKind(){ return state.mode === 'shadow' ? 'sentences' : 'scenarios'; }
function combinedPool(){
  const kind = currentPoolKind();
  let items = [];
  state.selectedCats.forEach(catId => { items = items.concat(POOLS[catId][kind]); });
  if(!items.length){ Object.keys(CATS).forEach(catId => { items = items.concat(POOLS[catId][kind]); }); }
  return items;
}
function filteredPool(){
  const q = state.searchQuery.trim().toLowerCase();
  const items = combinedPool();
  if(!q) return items;
  const kind = currentPoolKind();
  return items.filter(it => {
    const hay = kind === 'sentences' ? it.text : (it.title + ' ' + it.context + ' ' + it.prompt);
    return hay.toLowerCase().includes(q);
  });
}

/* ===========================================================================
   PRACTICE RUNTIME — imperative bindings for the currently mounted view
   =========================================================================== */
let rtRecording = false;       // true while the mic is actively listening
let rtSessionActive = false;   // true from tap-to-start until feedback (or an error) is shown -- covers the brief "Analyzing…" gap too
let recordingAborted = false;  // one-shot: set by abortRecordingIfActive so a pending onend/finish bails out silently
let rtTimerId = null;
let rtStartedAt = 0;
let rtPlaying = false;

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function playSentence(){
  if(!TTS.supported){ toast(t('t_ttsToast')); return; }
  if(rtSessionActive) return;   // never play Aria's voice into an open microphone
  const btn = document.getElementById('playBtn');
  if(rtPlaying){ TTS.stop(); rtPlaying = false; if(btn) btn.classList.remove('playing'); return; }
  rtPlaying = true;
  if(btn) btn.classList.add('playing');
  TTS.speak(state.currentItem.text, state.speedRate, null, (ok) => {
    rtPlaying = false;
    const b = document.getElementById('playBtn');
    if(b) b.classList.remove('playing');
    if(ok === false) toast(t('t_ttsFail'));
  });
}
function hearScenario(){
  if(!TTS.supported){ toast(t('t_ttsToast')); return; }
  if(rtSessionActive) return;
  const btn = document.getElementById('hearBtn');
  if(rtPlaying){ TTS.stop(); rtPlaying = false; if(btn) btn.classList.remove('playing'); return; }
  const item = state.currentItem;
  rtPlaying = true;
  if(btn) btn.classList.add('playing');
  TTS.speak(`${item.context} Your turn: ${item.prompt}`, 1, null, (ok) => {
    rtPlaying = false;
    const b = document.getElementById('hearBtn');
    if(b) b.classList.remove('playing');
    if(ok === false) toast(t('t_ttsFail'));
  });
}
function setSpeed(rate){
  state.speedRate = rate;
  document.querySelectorAll('.speed-pill button').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.speed) === rate);
  });
}
function toggleSampleUI(){
  state.sampleShown = !state.sampleShown;
  const box = document.querySelector('.sample-box');
  const btn = document.querySelector('[data-act="toggleSample"]');
  if(box) box.classList.toggle('show', state.sampleShown);
  if(btn) btn.innerHTML = `${ICONS.bookOpen} ${escapeHtml(t(state.sampleShown ? 'p_hideSample' : 'p_seeSample'))}`;
}

function updateLiveCaption(){
  const caption = document.getElementById('liveCaption');
  if(!caption) return;
  const text = (finalTranscriptText() + ' ' + rtInterim).trim();
  if(text){ caption.textContent = '"' + text + '"'; caption.classList.remove('placeholder'); }
  else { caption.textContent = t('p_listening'); caption.classList.add('placeholder'); }
}

/* mode: 'idle' | 'listening' | 'analyzing' */
function setLiveBoxState(mode){
  const liveBox = document.getElementById('liveBox');
  const label = document.getElementById('liveBoxLabel');
  const caption = document.getElementById('liveCaption');
  if(liveBox) liveBox.classList.toggle('is-live', mode === 'listening');
  if(label) label.textContent = mode === 'listening' ? t('p_listening') : (mode === 'analyzing' ? t('p_analyzing') : t('p_transcript'));
  if(mode === 'idle' && caption && caption.textContent !== t('p_noSpeech') && !caption.dataset.keep){
    caption.textContent = t('p_placeholder');
    caption.classList.add('placeholder');
  }
}

function toggleRecord(){
  const btn = document.getElementById('recordBtn');
  const hint = document.getElementById('recHint');
  const timerEl = document.getElementById('recTimer');
  if(!btn) return;

  if(!recognition){
    toast(t('t_sttToast'));
    return;
  }

  if(rtRecording){
    // ── Manual stop: user tapped the mic again while it was listening ──
    // Always call recognition.stop() here rather than gating on
    // recognitionActive -- start() was already called successfully (that's
    // why rtRecording is true), so the engine IS running even if its own
    // onstart event hasn't fired back to us yet. Skipping stop() in that
    // narrow window would finalize with an empty transcript despite speech
    // already being in flight.
    rtRecording = false;
    clearInterval(rtTimerId);
    btn.disabled = true;
    btn.classList.remove('recording');
    if(hint) hint.textContent = t('p_analyzingSpeech');
    setLiveBoxState('analyzing');
    try{ recognition.stop(); }catch(e){ finishRecording(); }
    return;
  }

  // ── Start a fresh recording ──
  if(rtPlaying){ TTS.stop(); rtPlaying = false; }
  recSession++;
  rtFinalChunks = [];
  rtInterim = '';
  rtRestartCount = 0;
  rtRestartWindowStart = Date.now();
  clearTimeout(silenceTimer);
  errorHandled = false;
  recordingAborted = false;

  rtRecording = true;
  rtSessionActive = true;
  rtStartedAt = performance.now();
  btn.classList.add('recording');
  btn.innerHTML = ICONS.stop;
  if(hint) hint.textContent = t('p_recording');
  if(timerEl){
    timerEl.style.visibility = 'visible';
    clearInterval(rtTimerId);
    const t0 = performance.now();
    rtTimerId = setInterval(() => { timerEl.textContent = fmtTime(performance.now()-t0); }, 250);
  }
  const existing = document.getElementById('feedbackSlot');
  if(existing) existing.innerHTML = '';
  if(state.mode === 'shadow') applyShadowWordDiff([]);
  setLiveBoxState('listening');
  updateLiveCaption();

  const mySession = recSession;
  const attemptStart = (isRetry) => {
    try{
      recognition.start();
      clearTimeout(startWatchdog);
      startWatchdog = setTimeout(() => {
        if(!recognitionActive && mySession === recSession && rtRecording){
          rtRecording = false;
          finishRecordingWithError(t('e_noResponse'));
        }
      }, 4000);
    }catch(e){
      if(isRetry){
        rtRecording = false;
        rtSessionActive = false;
        btn.classList.remove('recording');
        btn.innerHTML = ICONS.mic;
        if(hint) hint.textContent = t(state.mode === 'shadow' ? 'p_hintShadow' : 'p_hintFlow');
        setLiveBoxState('idle');
        toast(t('t_micFail'));
        return;
      }
      // Most likely an InvalidStateError: a previous session hadn't fully
      // torn down yet. Force it closed and retry once, shortly after.
      try{ recognition.abort(); }catch(e2){}
      recognitionActive = false;
      setTimeout(() => attemptStart(true), 250);
    }
  };
  attemptStart(false);
}

function finishRecording(){
  // Defensive idempotency guard: with the engine now ending its session
  // after every single utterance (see the continuous:false comment above)
  // and restarting rapidly, finalize must never run twice for one recording
  // even if two termination paths happened to race. rtSessionActive flips
  // false only once, right here or in finishRecordingWithError, so a
  // second call becomes a harmless no-op.
  if(!rtSessionActive) return;
  if(recordingAborted){ recordingAborted = false; rtSessionActive = false; return; }
  clearTimeout(silenceTimer);
  clearInterval(rtTimerId);
  const btn = document.getElementById('recordBtn');
  const hint = document.getElementById('recHint');
  const timerEl = document.getElementById('recTimer');
  if(btn){ btn.disabled = false; btn.classList.remove('recording'); btn.innerHTML = ICONS.mic; }
  if(timerEl) timerEl.style.visibility = 'hidden';

  // Combine the committed (finalized) transcript with any trailing "interim"
  // words still being recognized the moment the session ended -- otherwise
  // the last couple of spoken words can be lost.
  const transcript = (finalTranscriptText() + ' ' + rtInterim).trim();
  const durationMs = performance.now() - rtStartedAt;
  setLiveBoxState('idle');
  const caption = document.getElementById('liveCaption');
  if(caption){
    if(transcript){ caption.textContent = '"' + transcript + '"'; caption.classList.remove('placeholder'); }
    else { caption.textContent = t('p_noSpeech'); caption.classList.add('placeholder'); }
  }
  if(hint) hint.textContent = t(state.mode === 'shadow' ? 'p_againShadow' : 'p_againFlow');

  const data = { transcript, durationMs, avgConfidence: null };
  const fb = state.mode === 'shadow'
    ? computeShadowFeedback(state.currentItem.text, data)
    : computeFlowFeedback(state.currentItem, data);
  state.lastFeedback = fb;
  rtSessionActive = false;
  showFeedback(fb);
}

function finishRecordingWithError(message){
  if(!rtSessionActive) return; // see the guard comment in finishRecording()
  if(recordingAborted){ recordingAborted = false; rtSessionActive = false; return; }
  rtRecording = false;
  clearTimeout(silenceTimer);
  clearInterval(rtTimerId);
  const btn = document.getElementById('recordBtn');
  const hint = document.getElementById('recHint');
  const timerEl = document.getElementById('recTimer');
  if(btn){ btn.disabled = false; btn.classList.remove('recording'); btn.innerHTML = ICONS.mic; }
  if(timerEl) timerEl.style.visibility = 'hidden';
  setLiveBoxState('idle');
  const slot = document.getElementById('feedbackSlot');
  if(slot){ slot.innerHTML = `<div class="banner error">${ICONS.alert}<div>${escapeHtml(message)}</div></div>`; }
  if(hint) hint.textContent = t(state.mode === 'shadow' ? 'p_hintShadow' : 'p_hintFlow');
  rtSessionActive = false;
}

function abortRecordingIfActive(){
  if(rtSessionActive){
    rtRecording = false;
    rtSessionActive = false;
    recordingAborted = true;
    clearInterval(rtTimerId);
    clearTimeout(silenceTimer);
    clearTimeout(startWatchdog);
    if(recognition){ try{ recognition.abort(); }catch(e){} }
  }
  if(rtPlaying){ TTS.stop(); rtPlaying = false; }
}

function tryAgain(){
  state.lastFeedback = null;
  const slot = document.getElementById('feedbackSlot');
  if(slot) slot.innerHTML = '';
  if(state.mode === 'shadow') applyShadowWordDiff([]);
  setLiveBoxState('idle');
}

const viewRoot = () => document.getElementById('viewRoot');

function render(){
  let html = '';
  if(state.view === 'landing') html = landingHTML();

  else if(state.view === 'setup') html = setupHTML();

/* ----- language switching ----- */
function buildLangMenu(){
  const m = document.getElementById('langMenu');
  if(!m) return;
  m.innerHTML = LANGS.map(l => `<button class="lang-opt ${l.code===CUR_LANG?'active':''}" role="menuitem" data-act="setLang" data-lang="${l.code}">${flagHTML(l.code)}<span>${l.name}</span>${TICK_SVG}</button>`).join('');
}
function applyStaticI18n(){
  document.documentElement.setAttribute('lang', CUR_LANG);
  document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.setAttribute('title', t(el.getAttribute('data-i18n-title'))); });
  const f = document.getElementById('langBtnFlag');
  if(f) f.innerHTML = flagHTML(CUR_LANG);
  const c = document.getElementById('langBtnCode');
  if(c) c.textContent = (LANGS.find(l => l.code === CUR_LANG) || LANGS[0]).short;
  buildLangMenu();
  updateUserUI();
}
function closeLangMenu(){
  const m = document.getElementById('langMenu');
  const b = document.getElementById('langBtn');
  if(m) m.classList.remove('open');
  if(b) b.setAttribute('aria-expanded', 'false');
}
function toggleLangMenu(){
  const m = document.getElementById('langMenu');
  const b = document.getElementById('langBtn');
  if(!m) return;
  const open = !m.classList.contains('open');
  m.classList.toggle('open', open);
  if(b) b.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function setLang(code){
  if(!I18N[code]) return;
  closeLangMenu();
  if(code === CUR_LANG) return;
  const authKeep = auth.open ? readAuthFields() : null;
  const y = window.scrollY || 0;
  abortRecordingIfActive();
  CUR_LANG = code;
  state.lang = code;
  try{ localStorage.setItem(LANG_KEY, code); }catch(e){}
  applyStaticI18n();
  render();
  if(auth.open) renderAuth(authKeep);
  if(state.view === 'practice' && state.lastFeedback){
    const fb = state.lastFeedback;
    const slot = document.getElementById('feedbackSlot');
    if(slot){
      slot.innerHTML = feedbackPanelHTML(fb);
      if(fb.mode === 'shadow') applyShadowWordDiff(fb.diff);
    }
  }
  window.scrollTo(0, y);
}

/* ----- storage helpers (every access guarded; falls back to memory) ----- */
const memStore = {};
function storeGet(k){ try{ const v = localStorage.getItem(k); if(v !== null) return v; }catch(e){} return memStore[k] === undefined ? null : memStore[k]; }
function storeSet(k, v){ memStore[k] = v; try{ localStorage.setItem(k, v); }catch(e){} }
function storeDel(k){ delete memStore[k]; try{ localStorage.removeItem(k); }catch(e){} }
function loadAccounts(){ try{ return JSON.parse(storeGet(ACCOUNTS_KEY) || '{}') || {}; }catch(e){ return {}; } }
function saveAccounts(a){ storeSet(ACCOUNTS_KEY, JSON.stringify(a)); }
function loadSession(){ try{ const s = JSON.parse(storeGet(SESSION_KEY) || 'null'); return s && s.email ? s : null; }catch(e){ return null; } }
async function hashPassword(pw, salt){
  const s = salt + ':' + pw;
  try{
    if(window.crypto && window.crypto.subtle && window.TextEncoder){
      const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return 'sha256:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  }catch(e){}
  let x = 5381;
  for(let i = 0; i < s.length; i++){ x = ((x << 5) + x + s.charCodeAt(i)) | 0; }
  return 'weak:' + (x >>> 0).toString(16);
}
function updateUserUI(){
  const appEl = document.getElementById('app');

}

/* ----- auth modal ----- */

        <div class="auth-field"><label for="authEmail">${escapeHtml(t('auth_email'))}</label><div class="auth-input"><input id="authEmail" type="email" autocomplete="email" inputmode="email" placeholder="${escapeHtml(t('auth_emailPh'))}"></div></div>
        <div class="auth-field"><label for="authPass">${escapeHtml(t('auth_pass'))}</label><div class="auth-input has-toggle"><input id="authPass" type="${auth.showPass ? 'text' : 'password'}" autocomplete="${isCreate ? 'new-password' : 'current-password'}" placeholder="${escapeHtml(t('auth_passPh'))}"><button type="button" class="pw-toggle" id="pwToggle" data-act="authTogglePass">${escapeHtml(t(auth.showPass ? 'auth_hide' : 'auth_show'))}</button></div></div>
        <div class="auth-field"><label>${escapeHtml(t('auth_plan'))}</label>
          <div class="plan-pick">${PLANS.map(p => `<button type="button" class="plan-opt ${auth.plan === p.id ? 'active' : ''}" data-act="authPlan" data-plan="${p.id}"><b>$${p.price}</b><span>${escapeHtml(t('auth_months', { n: p.months }))}</span></button>`).join('')}</div>
        </div>
        <div class="auth-error" id="authError" role="alert"></div>
        <button class="btn btn-orange auth-submit" type="submit">${escapeHtml(t(isCreate ? 'auth_tabCreate' : 'auth_tabLogin'))}</button>
      </form>
      <div class="auth-switch">${escapeHtml(t(isCreate ? 'auth_haveAcct' : 'auth_newHere'))} <button type="button" data-act="authMode" data-mode="${isCreate ? 'login' : 'create'}">${escapeHtml(t(isCreate ? 'auth_loginLink' : 'auth_createLink'))}</button></div>
      <p class="auth-note">${escapeHtml(t('auth_demoNote'))}</p>
    </div>
  </div>`;
}
function renderAuth(keep){
  const root = document.getElementById('authRoot');
  if(!root) return;
  if(!auth.open){ root.innerHTML = ''; document.body.style.overflow = ''; return; }
  root.innerHTML = authHTML();
  document.body.style.overflow = 'hidden';
  if(keep){
    const e = document.getElementById('authEmail'); if(e && keep.email) e.value = keep.email;
    const p = document.getElementById('authPass'); if(p && keep.pass) p.value = keep.pass;
    const n = document.getElementById('authName'); if(n && keep.name) n.value = keep.name;
  }
}
function readAuthFields(){
  const v = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  return { name:v('authName'), email:v('authEmail'), pass:v('authPass') };
}
function openAuth(mode, plan){
  auth.open = true;
  auth.mode = mode === 'create' ? 'create' : 'login';
  if(plan && PLANS.some(p => p.id === plan)) auth.plan = plan;
  auth.showPass = false;
  renderAuth();
  setTimeout(() => { const el = document.getElementById(auth.mode === 'create' ? 'authName' : 'authEmail'); if(el && el.focus) el.focus(); }, 60);
}
function closeAuth(){
  auth.open = false;
  renderAuth();
}
function setAuthMode(mode){
  if(mode === auth.mode) return;
  const keep = readAuthFields();
  auth.mode = mode;
  renderAuth(keep);
}
function setAuthPlan(plan){
  auth.plan = plan;
  document.querySelectorAll('.plan-opt').forEach(b => b.classList.toggle('active', b.dataset.plan === plan));
}
function toggleAuthPass(){
  auth.showPass = !auth.showPass;
  const p = document.getElementById('authPass'); const b = document.getElementById('pwToggle');
  if(p) p.type = auth.showPass ? 'text' : 'password';
  if(b) b.textContent = t(auth.showPass ? 'auth_hide' : 'auth_show');
}
function showAuthError(msg){
  const el = document.getElementById('authError');
  if(!el) return;
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}
function startSession(user, toastMsg){
  state.user = { email:user.email, name:user.name, plan:user.plan };
  storeSet(SESSION_KEY, JSON.stringify(state.user));
  closeAuth();
  updateUserUI();
  enterDemo();
  toast(toastMsg || t('auth_welcomeToast', { name: user.name }));
}
async function submitAuth(){
  const f = readAuthFields();
  const email = f.email.trim().toLowerCase();
  showAuthError('');
  if(auth.mode === 'create' && f.name.trim().length < 2){ showAuthError(t('auth_errName')); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ showAuthError(t('auth_errEmail')); return; }
  if(f.pass.length < 8){ showAuthError(t('auth_errPass')); return; }
  const accounts = loadAccounts();
  if(auth.mode === 'create'){
    if(accounts[email]){ showAuthError(t('auth_errExists')); return; }
    const salt = Math.random().toString(36).slice(2);
    accounts[email] = { name:f.name.trim(), salt, hash: await hashPassword(f.pass, salt), plan: auth.plan, created: Date.now() };
    saveAccounts(accounts);
    startSession({ email, name:accounts[email].name, plan:auth.plan });
  } else {
    const acc = accounts[email];
    if(!acc){ showAuthError(t('auth_errNoAccount')); return; }
    if(acc.hash !== await hashPassword(f.pass, acc.salt)){ showAuthError(t('auth_errWrong')); return; }
    acc.plan = auth.plan;
    saveAccounts(accounts);
    startSession({ email, name:acc.name, plan:auth.plan });
  }
}
function authGoogle(){
  // Demo-only: real Google sign-in needs an OAuth client ID and a backend. This creates a local demo profile.
  const email = 'google.demo@langslate.local';
  const accounts = loadAccounts();
  if(!accounts[email]) accounts[email] = { name:'Google User', salt:'', hash:'', plan:auth.plan, created:Date.now() };
  saveAccounts(accounts);
  startSession({ email, name:accounts[email].name, plan:auth.plan }, t('auth_googleDemo'));
}
function logout(){
  abortRecordingIfActive();
  state.user = null;
  storeDel(SESSION_KEY);
  closeAuth();
  updateUserUI();
  goLanding();
  toast(t('auth_loggedOut'));
}

/* ----- landing <-> platform routing (hash based, so the Back button works) ----- */
function setHash(hash){ try{ if(location.hash !== hash) location.hash = hash; }catch(e){} }
function enterDemo(){
  abortRecordingIfActive();
  state.view = 'home';
  setHash('#/app');
  render();
}
function goLanding(){
  abortRecordingIfActive();
  state.view = 'landing';
  setHash('#/');
  render();
}
function routeFromHash(){
  const wantApp = (location.hash || '').indexOf('#/app') === 0;
  if(wantApp && state.view === 'landing'){ state.view = 'home'; render(); }
  else if(!wantApp && state.view !== 'landing'){ abortRecordingIfActive(); state.view = 'landing'; render(); }
}
function scrollToHow(){
  const el = document.getElementById('how');
  if(el && typeof el.scrollIntoView === 'function') el.scrollIntoView({ behavior:'smooth', block:'start' });
}

function goHome(){ abortRecordingIfActive(); state.view = 'home'; render(); }
function goSetup(mode){
  abortRecordingIfActive();
  if(mode){ state.mode = mode; }
  state.searchQuery = '';
  state.visibleCount = 12;
  state.view = 'setup';
  render();
}
function toggleCat(catId){
  if(state.selectedCats.has(catId)){
    if(state.selectedCats.size > 1) state.selectedCats.delete(catId);
  } else {
    state.selectedCats.add(catId);
  }
  state.visibleCount = 12;
  render();
}
function openItem(item){
  abortRecordingIfActive();
  state.currentItem = item;
  state.currentCat = item.catId;
  state.sampleShown = false;
  state.lastFeedback = null;
  state.view = 'practice';
  render();
}
function pickItemById(id){
  const item = findItemById(id);
  if(item) openItem(item);
}
function startRandom(){
  const pool = filteredPool();
  if(!pool.length){ toast(t('t_noItems')); return; }
  openItem(pickRandom(pool));
}
function shuffleFromList(){ startRandom(); }
function loadMore(){ state.visibleCount += 14; refreshList(); }
function nextItem(){
  const kind = currentPoolKind();
  let pool = [];
  state.selectedCats.forEach(c => pool = pool.concat(POOLS[c][kind]));
  if(!pool.length) pool = POOLS[state.currentItem.catId][kind];
  let candidate = pickRandom(pool);
  let guard = 0;
  while(candidate.id === state.currentItem.id && pool.length > 1 && guard < 10){ candidate = pickRandom(pool); guard++; }
  openItem(candidate);
}

/* ===========================================================================
   EVENT DELEGATION
   =========================================================================== */
document.addEventListener('click', (e) => {
  if(!e.target.closest('.lang-wrap')) closeLangMenu();
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  switch(act){
    case 'goHome': goHome(); break;
    case 'goSetup': goSetup(el.dataset.mode || null); break;
    case 'toggleCat': toggleCat(el.dataset.cat); break;
    case 'pickItem': pickItemById(el.dataset.id); break;
    case 'startRandom': startRandom(); break;
    case 'shuffleFromList': shuffleFromList(); break;
    case 'loadMore': loadMore(); break;
    case 'nextItem': nextItem(); break;
    case 'tryAgain': tryAgain(); break;
    case 'playSentence': playSentence(); break;
    case 'hearScenario': hearScenario(); break;
    case 'toggleSample': toggleSampleUI(); break;
    case 'toggleRecord': toggleRecord(); break;
    case 'setSpeed': setSpeed(parseFloat(el.dataset.speed)); break;
    case 'enterDemo': enterDemo(); break;
    case 'goLanding': goLanding(); break;
    case 'scrollHow': scrollToHow(); break;
    case 'loginTop': if(state.user) enterDemo(); else openAuth('login'); break;
    case 'openAuth': openAuth(el.dataset.mode, el.dataset.plan); break;
    case 'closeAuth': if(el.classList.contains('auth-overlay') && e.target !== el) break; closeAuth(); break;
    case 'authMode': setAuthMode(el.dataset.mode); break;
    case 'authPlan': setAuthPlan(el.dataset.plan); break;
    case 'authTogglePass': toggleAuthPass(); break;
    case 'authGoogle': authGoogle(); break;
    case 'logout': logout(); break;
    case 'toggleLang': toggleLangMenu(); break;
    case 'setLang': setLang(el.dataset.lang); break;
  }
});
document.getElementById('brandHome').addEventListener('click', () => {
  if(state.view === 'landing'){ try{ window.scrollTo({ top:0, behavior:'smooth' }); }catch(e){ window.scrollTo(0,0); } }
  else goHome();
});
window.addEventListener('hashchange', routeFromHash);
document.addEventListener('keydown', (e) => { if(e.key === 'Escape'){ closeLangMenu(); if(auth.open) closeAuth(); } });
document.addEventListener('submit', (e) => { if(e.target && e.target.id === 'authForm'){ e.preventDefault(); submitAuth(); } });
document.getElementById('themeToggle').addEventListener('click', () => applyTheme(state.theme === 'dark' ? 'light' : 'dark'));
document.addEventListener('visibilitychange', () => { if(document.hidden) abortRecordingIfActive(); });
window.addEventListener('pagehide', () => { if(rtRecording && recognition){ try{ recognition.abort(); }catch(e){} } });

/* ===========================================================================
   INIT
   =========================================================================== */
async function init(){
  CUR_LANG = detectLang();
  state.lang = CUR_LANG;
  applyStaticI18n();
  state.user = loadSession();
  updateUserUI();
  state.view = ((location.hash || '').indexOf('#/app') === 0) ? 'home' : 'landing';
  await loadTheme();
  await loadProgress();
  render();
}
init();
