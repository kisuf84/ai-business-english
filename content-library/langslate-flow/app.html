<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Langslate Flow — AI Voice Tutor</title>
<meta name="theme-color" content="#070B18">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%234F8CFF%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23FF7A2F%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%2230%22%20fill=%22url%28%23g%29%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%2221%22%20fill=%22%23070B18%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%2212%22%20fill=%22url%28%23g%29%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%234F8CFF%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23FF7A2F%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%2230%22%20fill=%22url%28%23g%29%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%2221%22%20fill=%22%23070B18%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%2212%22%20fill=%22url%28%23g%29%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{
  --bg:#070B18; --bg-soft:#0B1226; --surface:#101A34; --surface-2:#16213F; --surface-hover:#1C2A4D;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
  --text-1:#F5F7FF; --text-2:#AAB4D4; --text-3:#6E7999;
  --blue:#4F8CFF; --blue-dim:#274785; --orange:#FF7A2F; --orange-2:#FFA75C;
  --success:#34D399; --warn:#FBBF24; --danger:#FB7185;
  --shadow-lg:0 24px 70px rgba(0,0,0,.5); --shadow-sm:0 8px 24px rgba(0,0,0,.35);
  --grad-brand:linear-gradient(135deg,var(--blue),var(--orange));
  --grad-orb:conic-gradient(from 180deg at 50% 50%,var(--blue),var(--orange),var(--blue));
  --overlay-veil:rgba(7,11,24,.72);
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#EEF2FB; --bg-soft:#E3EAF9; --surface:#FFFFFF; --surface-2:#F4F7FF; --surface-hover:#E9EFFC;
  --border:rgba(14,22,55,.09); --border-strong:rgba(14,22,55,.16);
  --text-1:#0B1330; --text-2:#4A5578; --text-3:#818CB0;
  --blue:#2F6FED; --blue-dim:#D8E3FE; --orange:#FF7A29; --orange-2:#FF9750;
  --success:#159A52; --warn:#B45309; --danger:#DC2647;
  --shadow-lg:0 24px 60px rgba(31,45,90,.14); --shadow-sm:0 8px 20px rgba(31,45,90,.09);
  --grad-brand:linear-gradient(135deg,var(--blue),var(--orange));
  --grad-orb:conic-gradient(from 180deg at 50% 50%,var(--blue),var(--orange),var(--blue));
  --overlay-veil:rgba(238,242,251,.72);
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--text-1); font-family:'Manrope',system-ui,-apple-system,sans-serif;
  min-height:100vh; overflow-x:hidden; transition:background .35s ease,color .35s ease;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, color-mix(in srgb, var(--blue) 20%, transparent), transparent 60%),
    radial-gradient(ellipse 700px 500px at 110% 10%, color-mix(in srgb, var(--orange) 14%, transparent), transparent 60%),
    radial-gradient(ellipse 1000px 700px at 50% 120%, color-mix(in srgb, var(--blue) 10%, transparent), transparent 60%);
}
::selection{ background:var(--orange); color:#fff; }
h1,h2,h3,h4{ font-family:'Fraunces',Georgia,serif; font-weight:500; letter-spacing:-.01em; line-height:1.08; }
button{ font-family:inherit; cursor:pointer; }
a{ color:inherit; text-decoration:none; }
input,textarea{ font-family:inherit; }
.eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; }
.mono{ font-family:'IBM Plex Mono',monospace; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible{ outline:2px solid var(--orange); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; } }
/* ===== Layout shell ===== */
#app{ min-height:100vh; display:flex; flex-direction:column; }
.wrap{ width:100%; max-width:1080px; margin:0 auto; padding:0 24px; }
.topbar{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(16px) saturate(140%);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  border-bottom:1px solid var(--border);
}
.topbar-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 24px; max-width:1080px; margin:0 auto; gap:12px; }
.brand{ display:flex; align-items:center; gap:10px; cursor:pointer; border:none; background:none; padding:2px; }
.brand-mark{ width:34px; height:34px; border-radius:50%; background:var(--grad-orb); position:relative; flex:none;
  animation:orbit 7s linear infinite; box-shadow:0 0 0 3px var(--surface), 0 4px 16px color-mix(in srgb, var(--blue) 40%, transparent);}
.brand-mark::after{ content:''; position:absolute; inset:5px; border-radius:50%; background:var(--bg); }
.brand-mark::before{ content:''; position:absolute; inset:11px; border-radius:50%; background:var(--grad-brand); }
@keyframes orbit{ to{ filter:hue-rotate(0deg); transform:rotate(360deg);} }
.brand-word{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; letter-spacing:-.01em; }
.brand-word b{ font-weight:600; background:var(--grad-brand); -webkit-background-clip:text; background-clip:text; color:transparent; }
.topbar-actions{ display:flex; align-items:center; gap:8px; }
.streak-pill{ display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:100px; background:var(--surface); border:1px solid var(--border); font-size:13px; font-weight:700; color:var(--text-1); }
.streak-pill svg{ width:15px; height:15px; color:var(--orange); }
.icon-btn{ width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--text-2); display:flex; align-items:center; justify-content:center; transition:all .2s ease; flex:none; }
.icon-btn:hover{ background:var(--surface-hover); color:var(--text-1); transform:translateY(-1px); }
.icon-btn svg{ width:17px; height:17px; }
main{ flex:1; }
footer.app-footer{ padding:34px 24px 44px; text-align:center; color:var(--text-3); font-size:12.5px; border-top:1px solid var(--border); margin-top:60px; }

/* ===== Buttons ===== */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:14.5px;
  border-radius:100px; padding:13px 24px; border:1px solid transparent; transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease,background .18s ease; white-space:nowrap; }
.btn svg{ width:17px; height:17px; flex:none; }
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--grad-brand); color:#fff; box-shadow:0 10px 30px -8px color-mix(in srgb, var(--orange) 60%, var(--blue) 40%); }
.btn-primary:hover{ box-shadow:0 14px 36px -6px color-mix(in srgb, var(--orange) 65%, var(--blue) 45%); transform:translateY(-1px); }
.btn-secondary{ background:var(--surface); color:var(--text-1); border-color:var(--border-strong); }
.btn-secondary:hover{ background:var(--surface-hover); }
.btn-ghost{ background:transparent; color:var(--text-2); border-color:transparent; }
.btn-ghost:hover{ color:var(--text-1); background:var(--surface); }
.btn-block{ width:100%; }
.btn-lg{ padding:16px 28px; font-size:15.5px; }
.btn:disabled{ opacity:.45; pointer-events:none; }
.btn-danger-outline{ background:transparent; border-color:color-mix(in srgb, var(--danger) 50%, transparent); color:var(--danger); }
.btn-danger-outline:hover{ background:color-mix(in srgb, var(--danger) 12%, transparent); }

/* ===== Chips / pills ===== */
.chip-row{ display:flex; gap:10px; flex-wrap:wrap; }
.chip{ display:inline-flex; align-items:center; gap:8px; padding:10px 17px; border-radius:100px; background:var(--surface);
  border:1.5px solid var(--border); color:var(--text-2); font-weight:700; font-size:13.5px; transition:all .18s ease; }
.chip svg{ width:16px; height:16px; }
.chip:hover{ border-color:var(--border-strong); color:var(--text-1); }
.chip.active{ background:color-mix(in srgb, var(--blue) 16%, var(--surface)); border-color:var(--blue); color:var(--text-1); box-shadow:inset 0 0 0 1px var(--blue); }
.chip .count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-3); }
.chip.active .count{ color:var(--blue); }

/* ===== Cards ===== */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow-sm); }
.card-pad{ padding:28px; }
/* ===== Hero ===== */
.hero{ padding:64px 24px 20px; text-align:center; }
.hero-badge{ display:inline-flex; align-items:center; gap:8px; padding:7px 15px; border-radius:100px; background:var(--surface);
  border:1px solid var(--border); color:var(--text-2); margin-bottom:26px; }
.hero-badge span.dot{ width:6px; height:6px; border-radius:50%; background:var(--orange); box-shadow:0 0 0 3px color-mix(in srgb, var(--orange) 25%, transparent); }
.hero h1{ font-size:clamp(34px,6vw,60px); max-width:780px; margin:0 auto 18px; }
.hero h1 em{ font-style:italic; background:var(--grad-brand); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero p.lead{ font-size:clamp(15px,2vw,18px); color:var(--text-2); max-width:560px; margin:0 auto; line-height:1.6; }
.hero-stats{ display:flex; justify-content:center; gap:36px; margin:36px 0 8px; flex-wrap:wrap; }
.hero-stat b{ display:block; font-family:'Fraunces',serif; font-size:26px; }
.hero-stat span{ font-size:12px; color:var(--text-3); font-weight:600; letter-spacing:.02em; }

/* ===== Voice Orb (signature element) ===== */
.orb-wrap{ position:relative; width:180px; height:180px; margin:38px auto 30px; }
.orb-ring{ position:absolute; inset:0; border-radius:50%; background:var(--grad-orb); animation:spin 6s linear infinite; opacity:.9; }
.orb-ring.r2{ inset:-14px; opacity:.35; filter:blur(6px); animation-duration:9s; animation-direction:reverse; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.orb-core{ position:absolute; inset:10px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 30px rgba(0,0,0,.3); }
.orb-core svg{ width:46px; height:46px; color:var(--text-1); position:relative; z-index:2; }
.orb-core .bars{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:4px; opacity:0; transition:opacity .2s; }
.orb-core.listening .bars{ opacity:1; }
.orb-core.listening svg{ opacity:0; }
.orb-core .bars i{ display:block; width:4px; border-radius:3px; background:var(--grad-brand); height:8px; transition:height .09s ease; }
.orb-wrap.pulse .orb-ring{ animation:spin 2.2s linear infinite; }
.orb-wrap.idle-breathe .orb-core{ animation:breathe 3.4s ease-in-out infinite; }
@keyframes breathe{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.035);} }

/* ===== Mode cards ===== */
.mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:44px 0; }
.mode-card{ position:relative; overflow:hidden; text-align:left; padding:30px 26px; border-radius:26px; border:1px solid var(--border);
  background:var(--surface); transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease; }
.mode-card:hover{ transform:translateY(-4px); border-color:var(--border-strong); box-shadow:var(--shadow-lg); }
.mode-card .glow{ position:absolute; width:200px; height:200px; border-radius:50%; filter:blur(60px); opacity:.25; top:-60px; right:-60px; pointer-events:none; }
.mode-card.m-shadow .glow{ background:var(--blue); }
.mode-card.m-flow .glow{ background:var(--orange); }
.mode-icon{ width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
.mode-card.m-shadow .mode-icon{ background:color-mix(in srgb, var(--blue) 18%, transparent); color:var(--blue); }
.mode-card.m-flow .mode-icon{ background:color-mix(in srgb, var(--orange) 18%, transparent); color:var(--orange); }
.mode-icon svg{ width:26px; height:26px; }
.mode-card h3{ font-size:22px; margin-bottom:8px; }
.mode-card p{ color:var(--text-2); font-size:14px; line-height:1.55; margin-bottom:18px; }
.mode-card .tags{ display:flex; gap:8px; flex-wrap:wrap; }
.mode-card .tags span{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:100px; background:var(--surface-2); color:var(--text-2); }
.mode-cta{ display:flex; align-items:center; gap:6px; margin-top:20px; font-weight:700; font-size:13.5px; color:var(--text-1); }
.mode-cta svg{ width:15px; height:15px; transition:transform .18s ease; }
.mode-card:hover .mode-cta svg{ transform:translateX(4px); }

/* ===== Category grid ===== */
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:8px 0 18px; flex-wrap:wrap; }
.section-head h2{ font-size:24px; }
.section-head p{ color:var(--text-3); font-size:13.5px; }
.cat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.cat-card{ position:relative; padding:22px 18px; border-radius:20px; border:2px solid var(--border); background:var(--surface); text-align:left; transition:all .18s ease; overflow:hidden; }
.cat-card:hover{ border-color:var(--border-strong); transform:translateY(-2px); }
.cat-card.active{ border-color:var(--cat-color,var(--blue)); background:color-mix(in srgb, var(--cat-color,var(--blue)) 10%, var(--surface)); }
.cat-card .cat-icon{ width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; background:color-mix(in srgb, var(--cat-color,var(--blue)) 18%, transparent); color:var(--cat-color,var(--blue)); }
.cat-card .cat-icon svg{ width:21px; height:21px; }
.cat-card h4{ font-family:'Manrope',sans-serif; font-weight:800; font-size:15.5px; margin-bottom:3px; }
.cat-card p{ font-size:12px; color:var(--text-3); font-family:'IBM Plex Mono',monospace; }
.cat-card .check{ position:absolute; top:16px; right:16px; width:22px; height:22px; border-radius:50%; border:2px solid var(--border-strong); display:flex; align-items:center; justify-content:center; }
.cat-card.active .check{ background:var(--cat-color,var(--blue)); border-color:var(--cat-color,var(--blue)); }
.cat-card .check svg{ width:12px; height:12px; color:#fff; opacity:0; }
.cat-card.active .check svg{ opacity:1; }
/* ===== Setup view ===== */
.setup-shell{ padding:36px 24px 80px; }
.back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--text-2); font-size:13.5px; font-weight:700; margin-bottom:22px; }
.back-link svg{ width:15px; height:15px; }
.back-link:hover{ color:var(--text-1); }
.search-row{ display:flex; gap:10px; margin:22px 0 18px; }
.search-box{ flex:1; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 16px; }
.search-box svg{ width:17px; height:17px; color:var(--text-3); flex:none; }
.search-box input{ flex:1; background:none; border:none; outline:none; color:var(--text-1); font-size:14.5px; }
.search-box input::placeholder{ color:var(--text-3); }
.scen-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:26px; }
.scen-item{ display:flex; align-items:center; gap:16px; padding:16px 18px; border-radius:16px; background:var(--surface); border:1px solid var(--border); text-align:left; transition:all .16s ease; }
.scen-item:hover{ border-color:var(--border-strong); background:var(--surface-hover); }
.scen-item .num{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-3); flex:none; width:28px; }
.scen-item .body{ flex:1; min-width:0; }
.scen-item .body h5{ font-size:14.5px; font-weight:800; margin-bottom:3px; }
.scen-item .body p{ font-size:12.5px; color:var(--text-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.scen-item .arrow{ width:30px; height:30px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex:none; }
.scen-item .arrow svg{ width:14px; height:14px; }
.load-more-row{ display:flex; justify-content:center; margin:8px 0 20px; }
.setup-actions{ position:sticky; bottom:0; padding:18px 0 4px; background:linear-gradient(to top, var(--bg) 60%, transparent); display:flex; gap:12px; }

/* ===== Practice shell ===== */
.practice-shell{ padding:34px 24px 90px; max-width:760px; margin:0 auto; }
.practice-meta{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:10px; flex-wrap:wrap; }
.cat-tag{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:800; padding:6px 13px; border-radius:100px; background:color-mix(in srgb, var(--cat-color,var(--blue)) 16%, var(--surface)); color:var(--cat-color,var(--blue)); }
.cat-tag svg{ width:14px; height:14px; }
.progress-dots{ display:flex; gap:5px; }
.progress-dots i{ width:6px; height:6px; border-radius:50%; background:var(--border-strong); }
.progress-dots i.done{ background:var(--success); }

/* Sentence / scenario prompt card */
.prompt-card{ padding:36px 30px; border-radius:26px; background:var(--surface); border:1px solid var(--border); text-align:center; margin-bottom:22px; box-shadow:var(--shadow-sm); }
.prompt-eyebrow{ color:var(--text-3); margin-bottom:14px; }
.prompt-card blockquote{ font-family:'Fraunces',serif; font-style:italic; font-size:clamp(19px,3.4vw,27px); line-height:1.44; color:var(--text-1); }
.prompt-card blockquote span.word{ transition:color .2s; }
.prompt-card .context-line{ margin-top:16px; font-size:13.5px; color:var(--text-2); font-style:normal; font-family:'Manrope',sans-serif; }
.sample-toggle{ margin-top:18px; }
.sample-box{ margin-top:14px; padding:14px 18px; border-radius:14px; background:var(--surface-2); border:1px dashed var(--border-strong); font-size:13.5px; color:var(--text-2); text-align:left; display:none; }
.sample-box.show{ display:block; }
.sample-box b{ color:var(--text-1); }

.player-controls{ display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:26px; flex-wrap:wrap; }
.speed-pill{ display:flex; background:var(--surface); border:1px solid var(--border); border-radius:100px; padding:4px; gap:2px; }
.speed-pill button{ border:none; background:none; padding:8px 13px; border-radius:100px; font-size:12.5px; font-weight:700; color:var(--text-3); }
.speed-pill button.active{ background:var(--grad-brand); color:#fff; }
.play-btn{ width:58px; height:58px; border-radius:50%; border:none; background:var(--grad-brand); color:#fff; display:flex; align-items:center; justify-content:center;
  box-shadow:0 12px 28px -8px color-mix(in srgb, var(--blue) 60%, var(--orange) 40%); transition:transform .15s ease; }
.play-btn:hover{ transform:scale(1.05); }
.play-btn:active{ transform:scale(.94); }
.play-btn svg{ width:22px; height:22px; }
.play-btn.playing svg{ display:none; }
#hearBtn.playing{ color:var(--orange); border-color:var(--orange); }
.play-btn .eq{ display:none; gap:3px; align-items:flex-end; height:20px; }
.play-btn.playing .eq{ display:flex; }
.play-btn .eq i{ width:3px; background:#fff; border-radius:2px; animation:eqbar 0.8s ease-in-out infinite; }
.play-btn .eq i:nth-child(1){ animation-delay:0s; height:8px;} .play-btn .eq i:nth-child(2){ animation-delay:.15s; height:16px;}
.play-btn .eq i:nth-child(3){ animation-delay:.3s; height:10px;} .play-btn .eq i:nth-child(4){ animation-delay:.45s; height:18px;}
@keyframes eqbar{ 0%,100%{ transform:scaleY(.4);} 50%{ transform:scaleY(1);} }

/* Recorder */
.recorder-zone{ text-align:center; padding:8px 0 4px; }
.record-btn{ width:92px; height:92px; border-radius:50%; border:none; background:var(--surface); border:2px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center; margin:0 auto 16px; position:relative; transition:all .2s ease; }
.record-btn svg{ width:30px; height:30px; color:var(--danger); }
.record-btn:hover{ transform:scale(1.04); border-color:var(--danger); }
.record-btn.recording{ background:var(--danger); border-color:var(--danger); animation:recpulse 1.6s ease-in-out infinite; }
.record-btn.recording svg{ color:#fff; }
@keyframes recpulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(251,113,133,.45);} 50%{ box-shadow:0 0 0 16px rgba(251,113,133,0);} }
.rec-hint{ font-size:13px; color:var(--text-3); font-weight:600; min-height:18px; }
.rec-timer{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-2); margin-bottom:6px; }
/* ===== Live transcript box (under the record control) ===== */
.live-box{ margin:12px 0 4px; padding:14px 16px; border-radius:16px; background:var(--surface-2); border:1px solid var(--border); text-align:left; transition:border-color .25s ease, background .25s ease; }
.live-box .lb-head{ display:flex; align-items:center; gap:7px; margin-bottom:6px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); }
.live-box .lb-head svg{ width:13px; height:13px; flex:none; }
.live-box.is-live{ border-color:color-mix(in srgb, var(--orange) 45%, var(--border)); background:color-mix(in srgb, var(--orange) 6%, var(--surface-2)); }
.live-box.is-live .lb-head{ color:var(--orange); }
.live-box.is-live .lb-head svg{ animation:micPulse 1.3s ease-in-out infinite; }
@keyframes micPulse{ 0%,100%{ opacity:1;} 50%{ opacity:.4;} }
.live-box p{ font-size:14.5px; line-height:1.6; color:var(--text-1); font-style:italic; margin:0; min-height:22px; }
.live-box p.placeholder{ color:var(--text-3); }
/* ===== Feedback panel ===== */
.feedback-panel{ margin-top:8px; animation:riseIn .45s ease; }
@keyframes riseIn{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
.fb-head{ text-align:center; margin-bottom:22px; }
.fb-overall{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:6px; }
.fb-overall .score{ font-family:'Fraunces',serif; font-size:52px; font-weight:600; }
.fb-overall .label{ text-align:left; }
.fb-overall .label b{ display:block; font-size:15px; }
.fb-overall .label span{ font-size:12px; color:var(--text-3); }
.ring-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:14px; margin-bottom:24px; }
.ring-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:18px 12px; text-align:center; }
.ring{ width:76px; height:76px; margin:0 auto 10px; position:relative; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring circle{ fill:none; stroke-width:7; }
.ring .track{ stroke:var(--border); }
.ring .fill{ stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.16,1,.3,1); }
.ring .num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:16px; }
.ring-card h5{ font-size:12.5px; font-weight:800; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em; }
.tip-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
.tip{ display:flex; gap:12px; padding:14px 16px; border-radius:14px; background:var(--surface); border:1px solid var(--border); font-size:13.5px; line-height:1.5; color:var(--text-2); }
.tip svg{ width:18px; height:18px; flex:none; margin-top:1px; }
.tip.good svg{ color:var(--success); } .tip.warn svg{ color:var(--orange); } .tip.info svg{ color:var(--blue); }
.tip b{ color:var(--text-1); }
.transcript-box{ padding:18px 20px; border-radius:16px; background:var(--surface-2); border:1px solid var(--border); font-size:14.5px; line-height:1.7; margin-bottom:20px; }
.transcript-box h5{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); margin-bottom:8px; font-family:'IBM Plex Mono',monospace; font-weight:600; }
.w-hit{ color:var(--success); font-weight:700; }
.w-miss{ color:var(--danger); text-decoration:line-through; text-decoration-color:color-mix(in srgb, var(--danger) 60%, transparent); }
.w-key{ background:color-mix(in srgb, var(--orange) 22%, transparent); color:var(--text-1); padding:1px 5px; border-radius:5px; font-weight:700; }
.fb-actions{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.fb-actions .btn-secondary{ grid-column:1/-1; }

/* ===== Free Flow — premium feedback layout ===== */
.flow-fb .fb-eyebrow{ display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--orange); margin-bottom:14px; }
.flow-fb .fb-eyebrow svg{ width:15px; height:15px; }
.quote-card{ display:flex; gap:12px; align-items:flex-start; padding:18px 20px; border-radius:16px; background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--orange); margin-bottom:20px; }
.quote-card svg{ width:19px; height:19px; flex:none; margin-top:2px; color:var(--text-3); }
.quote-card p{ margin:0; font-size:15px; line-height:1.65; font-style:italic; color:var(--text-1); }
.quote-card p.muted{ color:var(--text-3); font-style:normal; }
.meter-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
.meter-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 18px; }
.meter-card .m-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:6px; }
.meter-card .m-num{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; line-height:1; margin-bottom:10px; }
.meter-card .bar-row{ display:flex; align-items:center; gap:10px; }
.meter-card .bar-track{ flex:1; height:7px; border-radius:100px; background:var(--border); overflow:hidden; }
.meter-card .bar-fill{ height:100%; border-radius:100px; transition:width 1s cubic-bezier(.16,1,.3,1); }
.meter-card .m-band{ font-size:11.5px; font-weight:700; white-space:nowrap; }
.overall-banner{ border-radius:16px; border:1px solid var(--border-strong); padding:18px 20px; margin-bottom:18px; }
.overall-banner .ob-title{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:800; letter-spacing:.04em; margin-bottom:8px; }
.overall-banner .ob-stats{ font-size:13.5px; color:var(--text-2); line-height:1.55; margin-bottom:10px; }
.overall-banner .ob-tip{ font-size:13.5px; color:var(--text-2); line-height:1.6; padding-left:2px; }
.overall-banner .ob-tip + .ob-tip{ margin-top:6px; }
.overall-banner .ob-tip b{ color:var(--text-1); }

/* ===== Footer credit ===== */
.footer-credit{ display:flex; align-items:center; justify-content:center; gap:9px; margin-top:14px; opacity:.72; }
.footer-credit img{ width:22px; height:22px; border-radius:50%; object-fit:cover; flex:none; }
.footer-credit span{ font-size:11.5px; letter-spacing:.01em; }

/* ===== Permission / status banners ===== */
.banner{ display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:14px; background:var(--surface); border:1px solid var(--border-strong); font-size:13px; color:var(--text-2); margin-bottom:20px; }
.banner svg{ width:19px; height:19px; color:var(--orange); flex:none; margin-top:1px; }
.banner.error svg{ color:var(--danger); }
.banner b{ color:var(--text-1); }

/* toast */
#toast-host{ position:fixed; bottom:22px; left:0; right:0; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; padding:0 16px; pointer-events:none; }
.toast{ background:var(--text-1); color:var(--bg); font-weight:700; font-size:13.5px; padding:12px 20px; border-radius:100px; box-shadow:var(--shadow-lg); animation:toastIn .3s ease, toastOut .3s ease 2.4s forwards; max-width:340px; text-align:center; }
@keyframes toastIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
@keyframes toastOut{ to{ opacity:0; transform:translateY(-6px);} }

/* view transitions */
.view{ display:none; }
.view.active{ display:block; animation:fadeSlide .4s cubic-bezier(.16,1,.3,1); }
@keyframes fadeSlide{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }

/* how it works */
.how-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin:60px 0; }
.how-card{ padding:24px 20px; }
.how-card .step-eyebrow{ color:var(--orange); margin-bottom:12px; }
.how-card h4{ font-size:16.5px; margin-bottom:8px; }
.how-card p{ font-size:13.5px; color:var(--text-2); line-height:1.55; }

/* Responsive */
@media (max-width: 860px){
  .mode-grid{ grid-template-columns:1fr; }
  .cat-grid{ grid-template-columns:repeat(3,1fr); gap:10px; }
  .how-grid{ grid-template-columns:1fr; }
}

  .wrap,.setup-shell,.practice-shell,.hero{ padding-left:16px; padding-right:16px; }
  .hero{ padding-top:40px; }
  .hero-stats{ gap:22px; }

  .cat-card p{ font-size:10px; }
  .cat-card .cat-icon{ width:32px; height:32px; margin-bottom:8px; }
  .cat-card .cat-icon svg{ width:16px; height:16px; }
  .cat-card .check{ width:18px; height:18px; top:10px; right:10px; }
  .prompt-card{ padding:26px 18px; }
  .ring-grid{ grid-template-columns:repeat(2,1fr); }
  .meter-grid{ grid-template-columns:1fr; }
  .fb-actions{ grid-template-columns:1fr; }
  .fb-actions .btn-secondary{ grid-column:auto; }
  .brand-word{ font-size:16px; }
  .streak-pill span.streak-text{ display:none; }

  .cat-card p{ display:none; }
}

/* ===== Language switcher ===== */
.lang-wrap{ position:relative; }
.lang-btn{ display:flex; align-items:center; gap:7px; height:38px; padding:0 10px 0 9px; border-radius:100px; border:1px solid var(--border); background:var(--surface); color:var(--text-1); font-weight:800; font-size:12.5px; letter-spacing:.04em; transition:all .2s ease; }
.lang-btn:hover{ background:var(--surface-hover); transform:translateY(-1px); }
.lang-btn .chev{ width:12px; height:12px; color:var(--text-3); transition:transform .2s ease; }
.lang-btn[aria-expanded="true"] .chev{ transform:rotate(180deg); }
.flag{ display:inline-flex; width:22px; height:15px; border-radius:3px; overflow:hidden; flex:none; box-shadow:0 0 0 1px rgba(128,140,180,.35), 0 1px 3px rgba(0,0,0,.3); }
.flag svg{ width:100%; height:100%; display:block; }
.lang-menu{ position:absolute; right:0; top:calc(100% + 10px); min-width:200px; padding:6px; border-radius:18px; background:var(--surface); border:1px solid var(--border-strong); box-shadow:var(--shadow-lg);
  opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right; pointer-events:none; visibility:hidden; transition:opacity .16s ease, transform .16s ease, visibility .16s; z-index:70; }
.lang-menu.open{ opacity:1; transform:none; pointer-events:auto; visibility:visible; }
.lang-opt{ display:flex; align-items:center; gap:12px; width:100%; padding:11px 12px; border:none; background:none; border-radius:12px; color:var(--text-2); font-weight:700; font-size:14.5px; text-align:left; }
.lang-opt:hover{ background:var(--surface-hover); color:var(--text-1); }
.lang-opt.active{ color:var(--text-1); background:color-mix(in srgb, var(--blue) 14%, transparent); }
.lang-opt .flag{ width:26px; height:18px; }
.lang-opt .tick{ margin-left:auto; width:15px; height:15px; color:var(--blue); opacity:0; }
.lang-opt.active .tick{ opacity:1; }
.link-btn{ background:none; border:none; color:var(--text-2); font-size:12.5px; font-weight:700; text-decoration:underline; text-underline-offset:3px; margin-top:10px; padding:6px 10px; }
.link-btn:hover{ color:var(--text-1); }
.demo-btn{ display:none; padding:9px 18px; font-size:12.5px; letter-spacing:.1em; }
.view-landing .demo-btn{ display:inline-flex; }
.view-landing .streak-pill, .view-landing .to-landing{ display:none; }

/* ===== Landing page ===== */
.land-hero{ position:relative; max-width:1080px; margin:0 auto; padding:70px 24px 20px; text-align:center; overflow-x:clip; }
.land-aurora{ position:absolute; inset:-40px 0 auto 0; height:520px; pointer-events:none; z-index:-1; overflow:hidden; }
.land-aurora i{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.35; }
.land-aurora i:nth-child(1){ width:420px; height:420px; background:var(--blue); left:6%; top:-60px; animation:floaty 14s ease-in-out infinite; }
.land-aurora i:nth-child(2){ width:360px; height:360px; background:var(--orange); right:4%; top:30px; opacity:.26; animation:floaty 17s ease-in-out infinite reverse; }
@keyframes floaty{ 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(24px,18px);} }
.land-hero h1{ font-size:clamp(44px,9vw,92px); line-height:1.01; max-width:920px; margin:0 auto 22px; letter-spacing:-.025em; font-weight:500; }
.land-hero h1 em{ font-style:italic; background:var(--grad-brand); -webkit-background-clip:text; background-clip:text; color:transparent; padding-right:.06em; }
.land-hero .lead{ font-size:clamp(15px,2vw,19px); color:var(--text-2); max-width:660px; margin:0 auto; line-height:1.65; }

.demo-cta::after{ content:''; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent); transform:skewX(-18deg); animation:shine 3.8s ease-in-out infinite; }
@keyframes shine{ 0%,55%{ left:-60%; } 100%{ left:140%; } }
.demo-cta .live-dot{ width:8px; height:8px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.28); animation:pulseDot 1.8s ease-in-out infinite; }
@keyframes pulseDot{ 0%,100%{ box-shadow:0 0 0 3px rgba(255,255,255,.28);} 50%{ box-shadow:0 0 0 7px rgba(255,255,255,.08);} }
.land-note{ font-size:12.5px; color:var(--text-3); font-weight:600; }
.land-visual{ position:relative; margin:50px auto 0; max-width:540px; text-align:left; }
.land-visual::before{ content:''; position:absolute; inset:-18px; border-radius:40px; background:var(--grad-brand); opacity:.22; filter:blur(36px); z-index:-1; }
.mock-card{ border-radius:28px; padding:22px 22px 24px; background:color-mix(in srgb, var(--surface) 92%, transparent); border:1px solid var(--border-strong); box-shadow:var(--shadow-lg); backdrop-filter:blur(10px); }
.mock-top{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.mock-top .brand-mark{ width:30px; height:30px; animation-duration:9s; }
.mock-top b{ font-family:'Fraunces',serif; font-size:17px; font-weight:600; }
.mock-top .cat-tag{ margin-left:auto; }
.mock-sentence{ font-family:'Fraunces',serif; font-style:italic; font-size:clamp(17px,3.2vw,21px); line-height:1.5; margin-bottom:16px; }
.mock-wave{ display:flex; align-items:center; justify-content:center; gap:4px; height:34px; margin-bottom:16px; }
.mock-wave i{ display:block; width:4px; border-radius:3px; background:var(--grad-brand); animation:wave 1.1s ease-in-out infinite; }
@keyframes wave{ 0%,100%{ height:6px;} 50%{ height:30px;} }
.mock-card .ring-grid{ margin-bottom:0; gap:8px; }
.land-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; max-width:1080px; margin:56px auto 0; padding:0 24px; }
.land-stat{ padding:22px 14px; border-radius:20px; background:var(--surface); border:1px solid var(--border); text-align:center; }
.land-stat b{ display:block; font-family:'Fraunces',serif; font-size:clamp(26px,4vw,38px); font-weight:600; line-height:1.05; background:var(--grad-brand); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:8px; }
.land-stat span{ font-size:10.5px; letter-spacing:.1em; font-weight:700; color:var(--text-3); font-family:'IBM Plex Mono',monospace; }
.land-section{ max-width:1080px; margin:0 auto; padding:84px 24px 0; scroll-margin-top:70px; }
.land-section > h2{ font-size:clamp(28px,4.6vw,44px); text-align:center; margin-bottom:10px; }

.feat-card p{ font-size:13px; color:var(--text-2); line-height:1.55; }

.land-section .cat-card{ cursor:default; }
.land-section .cat-card:hover{ transform:none; border-color:var(--border); }
.lang-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:760px; margin:0 auto; }

@media (max-width: 860px){
  .land-stats{ grid-template-columns:1fr 1fr; }

/* ===== Pricing ===== */

.price-card.popular{ border-color:var(--blue); box-shadow:0 0 0 1px var(--blue), 0 24px 60px -20px color-mix(in srgb, var(--blue) 45%, transparent); }

.price-badge{ position:absolute; top:-13px; right:22px; padding:6px 14px; border-radius:100px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.1em; color:#fff; background:var(--blue); }
.price-card.best .price-badge{ background:var(--orange); color:#1d0e03; }
.price-name{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); margin-bottom:18px; }
.price-amount{ font-family:'Fraunces',serif; font-weight:600; font-size:58px; line-height:1; letter-spacing:-.02em; display:flex; align-items:flex-start; gap:2px; }
.price-amount sup{ font-size:26px; margin-top:6px; }
.price-for{ margin-top:12px; color:var(--text-2); font-size:14.5px; }
.price-per{ margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--blue); }
.price-card.best .price-per{ color:var(--orange); }
.price-card hr{ border:none; border-top:1px solid var(--border); margin:24px 0 22px; }
.price-feats{ list-style:none; display:grid; gap:14px; margin:0 0 28px; padding:0; flex:1; align-content:start; }
.price-feats li{ display:flex; gap:12px; font-size:14px; line-height:1.4; color:var(--text-1); }
.price-feats li svg{ width:16px; height:16px; flex:none; margin-top:2px; color:var(--success); }
.btn-orange{ background:var(--orange); color:#1d0e03; box-shadow:0 10px 28px -10px color-mix(in srgb, var(--orange) 70%, transparent); }
.btn-orange:hover{ transform:translateY(-1px); filter:brightness(1.06); }
/* ===== Auth modal ===== */
.auth-overlay{ position:fixed; inset:0; z-index:120; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--overlay-veil); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); animation:fadeIn .2s ease; overflow-y:auto; }
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
.auth-card{ position:relative; width:100%; max-width:460px; margin:auto; padding:30px 28px 24px; border-radius:30px; background:var(--surface); border:1px solid var(--border-strong); box-shadow:var(--shadow-lg); animation:authIn .3s cubic-bezier(.16,1,.3,1); }
@keyframes authIn{ from{ opacity:0; transform:translateY(18px) scale(.98);} to{ opacity:1; transform:none;} }
.auth-card::before{ content:''; position:absolute; inset:0; border-radius:30px; pointer-events:none; background:radial-gradient(ellipse 70% 40% at 0% 0%, color-mix(in srgb, var(--blue) 18%, transparent), transparent 70%), radial-gradient(ellipse 60% 40% at 100% 100%, color-mix(in srgb, var(--orange) 14%, transparent), transparent 70%); }
.auth-card > *{ position:relative; }
.auth-close{ position:absolute !important; top:18px; right:18px; z-index:5; cursor:pointer; }
.auth-card h3{ font-size:30px; margin-bottom:6px; padding-right:48px; }
.auth-sub{ color:var(--text-2); font-size:14.5px; margin-bottom:20px; }
.auth-tabs{ display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border-radius:16px; background:var(--bg-soft); border:1px solid var(--border); margin-bottom:16px; }
.auth-tab{ border:none; background:none; padding:12px; border-radius:12px; font-weight:800; font-size:14px; color:var(--text-2); transition:all .18s ease; }
.auth-tab.active{ background:var(--grad-brand); color:#fff; box-shadow:0 8px 20px -8px color-mix(in srgb, var(--orange) 60%, var(--blue)); }
.google-btn{ display:flex; align-items:center; justify-content:center; gap:12px; width:100%; padding:15px; border-radius:16px; border:1px solid var(--border-strong); background:#fff; color:#1f2430; font-weight:800; font-size:15px; transition:transform .15s ease, box-shadow .15s ease; }
.google-btn:hover{ transform:translateY(-1px); box-shadow:0 10px 24px -10px rgba(0,0,0,.4); }
.google-btn svg{ width:20px; height:20px; }
.auth-or{ display:flex; align-items:center; gap:14px; margin:18px 0 14px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.16em; color:var(--text-3); font-weight:600; }
.auth-or::before,.auth-or::after{ content:''; flex:1; height:1px; background:var(--border); }
.auth-field{ margin-bottom:14px; }
.auth-field label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.14em; font-weight:600; color:var(--text-3); margin-bottom:7px; }
.auth-input{ position:relative; }
.auth-input input{ width:100%; padding:15px 16px; border-radius:14px; border:1px solid var(--border-strong); background:var(--bg-soft); color:var(--text-1); font-size:15px; outline:none; transition:border-color .15s ease, box-shadow .15s ease; }
.auth-input input::placeholder{ color:var(--text-3); }
.auth-input input:focus{ border-color:var(--orange); box-shadow:0 0 0 3px color-mix(in srgb, var(--orange) 22%, transparent); }
.auth-input .pw-toggle{ position:absolute; right:12px; top:50%; transform:translateY(-50%); border:none; background:none; color:var(--text-2); font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.12em; padding:6px; }
.auth-input.has-toggle input{ padding-right:76px; }
.plan-pick{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.plan-opt{ padding:14px 6px; border-radius:14px; border:1.5px solid var(--border-strong); background:var(--bg-soft); color:var(--text-2); text-align:center; transition:all .16s ease; }
.plan-opt b{ display:block; font-family:'Fraunces',serif; font-size:22px; color:var(--text-1); margin-bottom:3px; }
.plan-opt span{ font-size:12.5px; }
.plan-opt:hover{ border-color:var(--text-3); }
.plan-opt.active{ border-color:var(--orange); background:color-mix(in srgb, var(--orange) 12%, var(--bg-soft)); }
.auth-error{ display:none; margin:2px 0 14px; padding:12px 14px; border-radius:12px; font-size:13px; font-weight:600; color:var(--danger); background:color-mix(in srgb, var(--danger) 10%, transparent); border:1px solid color-mix(in srgb, var(--danger) 35%, transparent); }
.auth-error.show{ display:block; }
.auth-submit{ width:100%; margin-top:6px; padding:16px; font-size:16px; }
.auth-switch{ text-align:center; margin-top:16px; font-size:13.5px; color:var(--text-2); }
.auth-switch button{ background:none; border:none; color:var(--orange); font-weight:800; font-size:13.5px; text-decoration:underline; text-underline-offset:3px; padding:0; }
.auth-note{ text-align:center; margin-top:12px; font-size:11.5px; color:var(--text-3); line-height:1.5; }
.login-btn{ display:none; padding:9px 16px; font-size:13px; gap:7px; }
.login-btn svg{ width:16px; height:16px; }
.view-landing .login-btn{ display:inline-flex; }
.has-user .demo-btn{ display:none !important; }
.logout-btn{ display:flex; }
.view-landing:not(.has-user) .logout-btn{ display:none; }
.logout-btn:hover{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 50%, transparent); }
@media (max-width: 860px){
  .price-grid{ grid-template-columns:1fr; max-width:460px; margin:0 auto; gap:30px; }
}
@media (max-width: 600px){
  .login-btn{ width:38px; height:38px; padding:0; border-radius:50%; }
  .login-text{ display:none; }
  .price-card{ padding:30px 22px 26px; }
  .auth-card{ padding:26px 20px 20px; border-radius:26px; }
  .auth-card h3{ font-size:26px; }
  .topbar-actions{ gap:5px; }
}
@media (max-width: 440px){
  .topbar-inner{ gap:6px; }
  .brand{ gap:7px; min-width:0; }
  .brand-mark{ width:30px; height:30px; }
  .brand-word{ font-size:15px; white-space:nowrap; }
  .topbar-actions{ gap:4px; }
  .topbar-actions .icon-btn, .login-btn{ width:34px; height:34px; }
  .demo-btn{ padding:8px 11px; font-size:11px; letter-spacing:.06em; }
  .lang-btn{ height:34px; padding:0 8px; gap:4px; }
  .lang-btn .chev{ display:none; }
}
@media (max-width: 345px){
  .view-landing .brand-word{ display:none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" id="brandHome" aria-label="Langslate Flow home" data-i18n-aria="brandAria">
        <span class="brand-mark"></span>
        <span class="brand-word">Langslate <b>Flow</b></span>
      </button>
      <div class="topbar-actions">
        <button class="btn btn-secondary login-btn" id="loginTop" data-act="loginTop" aria-label="Log in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg><span class="login-text" id="loginTopText">Log in</span></button>
        <button class="btn btn-primary demo-btn" id="demoTop" data-act="enterDemo" data-i18n="demo">DEMO</button>
        <div class="streak-pill" id="streakPill" title="Your practice streak" data-i18n-title="streakTitle">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-2 4-2 7a3 3 0 006 0c1.5 1.5 2 3.5 2 5a6 6 0 11-12 0c0-4 3-6 4-8 1-1.5 1.5-3 2-4z"/></svg>
          <span id="streakNum">0</span> <span class="streak-text" data-i18n="dayStreak">day streak</span>
        </div>
        <div class="lang-wrap">
          <button class="lang-btn" id="langBtn" data-act="toggleLang" aria-haspopup="true" aria-expanded="false" aria-label="Change language" data-i18n-aria="langAria">
            <span id="langBtnFlag"></span><span class="lang-code" id="langBtnCode">EN</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="lang-menu" id="langMenu" role="menu"></div>
        </div>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle light and dark mode" data-i18n-aria="themeAria"></button>
        <button class="icon-btn logout-btn" id="logoutBtn" data-act="logout" aria-label="Log out" title="Log out" data-i18n-aria="auth_logout" data-i18n-title="auth_logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
      </div>
    </div>
  </header>

  <main id="viewRoot">
    <!-- Views are rendered here by JS -->
  </main>

  <footer class="app-footer">
    <span data-i18n="footerLine">Langslate Flow — practice speaking, privately. All voice analysis runs on your device; nothing is uploaded.</span>
    <div><button class="link-btn to-landing" data-act="goLanding" data-i18n="toLanding">About Langslate Flow</button></div>

function hashCode(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function fillTemplate(tmpl, seed){
  return tmpl.replace(/\{(\w+)\}/g, (whole, slot) => {
    const arr = VOCAB[slot];
    if(!arr) return whole;
    const stride = 1 + (hashCode(slot) % 13);
    const idx = (seed*stride + hashCode(slot+tmpl.length)) % arr.length;
    return arr[idx];
  });
}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

/* ===== Pool generation: guarantees 2,000 unique items per category (6,000 per mode) =====
   Each template's placeholder slots are combined via a mixed-radix index so
   every generated item is a genuinely distinct, deterministic combination —
   and for scenarios, the SAME sampled values are reused across the title,
   context, prompt and sample answer, so names/places stay consistent. */
const SENTENCE_TARGET = 2000;   // per category → 6,000 Shadow Flow sentences in total
const SCENARIO_TARGET = 2000;   // per category → 6,000 Free Flow scenarios in total
const PER_TEMPLATE_CAP_SENTENCE = 700;
const PER_TEMPLATE_CAP_SCENARIO = 200;

function templateSlots(str){
  const found = str.match(/\{(\w+)\}/g) || [];
  return Array.from(new Set(found.map(m => m.slice(1, -1))));
}
function cartesianSize(slots){
  return slots.reduce((p, s) => p * (VOCAB[s] ? VOCAB[s].length : 1), 1);
}
function decodeCombo(j, slots){
  const vals = {};
  let rem = j;
  for(const s of slots){
    const arr = VOCAB[s] || ['?'];
    const n = arr.length;
    vals[s] = arr[rem % n];
    rem = Math.floor(rem / n);
  }
  return vals;
}
function fillWithValues(tmpl, vals){
  return tmpl.replace(/\{(\w+)\}/g, (m, slot) => (vals[slot] !== undefined ? vals[slot] : m));
}

function generateSentencePool(catId, templates){
  const seen = new Set();
  const out = [];
  const slotsPer = templates.map(t => templateSlots(t));
  const sizes = slotsPer.map(s => Math.min(PER_TEMPLATE_CAP_SENTENCE, cartesianSize(s)));
  let round = 0, progress = true;
  while(out.length < SENTENCE_TARGET && progress){
    progress = false;
    for(let ti = 0; ti < templates.length; ti++){
      if(out.length >= SENTENCE_TARGET) break;
      if(round >= sizes[ti]) continue;
      const vals = decodeCombo(round, slotsPer[ti]);
      const text = cap(fillWithValues(templates[ti], vals));
      if(!seen.has(text)){
        seen.add(text);
        out.push({ id: catId + '-s-' + out.length, catId, text });
        progress = true;
      }
    }
    round++;
  }
  return out;
}

function generateScenarioPool(catId, templates){
  const seen = new Set();
  const out = [];
  const combinedStr = templates.map(t => `${t.t} ${t.c} ${t.p} ${t.s}`);
  const slotsPer = combinedStr.map(s => templateSlots(s));
  const sizes = slotsPer.map(s => Math.min(PER_TEMPLATE_CAP_SCENARIO, cartesianSize(s)));
  let round = 0, progress = true;
  while(out.length < SCENARIO_TARGET && progress){
    progress = false;
    for(let ti = 0; ti < templates.length; ti++){
      if(out.length >= SCENARIO_TARGET) break;
      if(round >= sizes[ti]) continue;
      const tmpl = templates[ti];
      const vals = decodeCombo(round, slotsPer[ti]);
      const title = cap(fillWithValues(tmpl.t, vals));
      const context = cap(fillWithValues(tmpl.c, vals));
      const prompt = cap(fillWithValues(tmpl.p, vals));
      const sample = cap(fillWithValues(tmpl.s, vals));
      const key = title + '|' + context;
      if(!seen.has(key)){
        seen.add(key);
        out.push({ id: catId + '-sc-' + out.length, catId, title, context, prompt, sample, vocab: tmpl.v.slice() });
        progress = true;
      }
    }
    round++;
  }
  return out;
}

const POOLS = {};
Object.keys(CATS).forEach(catId => {
  const cat = CATS[catId];
  POOLS[catId] = {
    sentences: generateSentencePool(catId, cat.sentences),
    scenarios: generateScenarioPool(catId, cat.scenarios)
  };
});

function poolSize(catId, kind){ return POOLS[catId] ? POOLS[catId][kind].length : 0; }
function totalScenarios(){ return Object.keys(CATS).reduce((n,c)=> n + poolSize(c,'scenarios'), 0); }
function totalSentences(){ return Object.keys(CATS).reduce((n,c)=> n + poolSize(c,'sentences'), 0); }
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const STORAGE_KEY = 'langslate-flow-progress';
async function loadProgress(){
  try{
    if(!window.storage) return;
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const data = JSON.parse(res.value);
      state.streak = data.streak || 0;
      state.totalCompleted = data.totalCompleted || 0;
      state.lastPracticeDate = data.lastPracticeDate || null;
      state.history = data.history || [];
    }
  }catch(e){ /* first run or storage unavailable — start fresh */ }
  refreshStreakUI();
}
async function saveProgress(){
  try{
    if(!window.storage) return;
    await window.storage.set(STORAGE_KEY, JSON.stringify({
      streak: state.streak,
      totalCompleted: state.totalCompleted,
      lastPracticeDate: state.lastPracticeDate,
      history: state.history.slice(-30)
    }), false);
  }catch(e){ /* non-fatal */ }
}
function dayKey(d){ return d.toISOString().slice(0,10); }
function registerCompletion(overall, mode, catId){
  const today = dayKey(new Date());
  if(state.lastPracticeDate !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    state.streak = (state.lastPracticeDate === dayKey(y)) ? state.streak + 1 : 1;
    state.lastPracticeDate = today;
  }
  state.totalCompleted++;
  state.history.push({ overall, mode, catId, date: today });
  refreshStreakUI();
  saveProgress();
}
function refreshStreakUI(){
  const el = document.getElementById('streakNum');
  if(el) el.textContent = state.streak;
}

async function loadTheme(){
  // Dark is this app's default look, full stop -- it must never be
  // silently overridden by the device/browser's system color-scheme
  // preference. The ONLY thing allowed to switch it to light is the person
  // explicitly tapping the theme toggle themselves in a previous visit,
  // recovered here from whichever persistence layer is available.
  let t = 'dark';
  try{
    const saved = localStorage.getItem('langslate-flow-theme');
    if(saved === 'dark' || saved === 'light'){
      t = saved;

      const res = await window.storage.get('langslate-flow-theme', false);
      if(res && (res.value === 'dark' || res.value === 'light')) t = res.value;
    }
  }catch(e){}
  applyTheme(t);
}
